recitals:
  - id: recital-25
    cite: "Recital 25"
    source_celex: "32024R1689"
    provenance: "authentic OJ"
    verified: "2026-09-12 against CELEX 32024R1689"
    text: >-
      This Regulation should support innovation, should respect freedom of science, and
      should not undermine research and development activity. It is therefore necessary to
      exclude from its scope AI systems and models specifically developed and put into
      service for the sole purpose of scientific research and development. Moreover, it is
      necessary to ensure that this Regulation does not otherwise affect scientific
      research and development activity on AI systems or models prior to being placed on
      the market or put into service. As regards product-oriented research, testing and
      development activity regarding AI systems or models, the provisions of this
      Regulation should also not apply prior to those systems and models being put into
      service or placed on the market. That exclusion is without prejudice to the
      obligation to comply with this Regulation where an AI system falling into the scope
      of this Regulation is placed on the market or put into service as a result of such
      research and development activity and to the application of provisions on AI
      regulatory sandboxes and testing in real world conditions. [...]
    notes:
      - >-
        SPLITS R&D IN TWO, and the split is the useful part. Scientific R&D is excluded
        outright by Art. 2(6), on the 'sole purpose' test. Product-oriented R&D is not
        excluded: the Regulation merely does not apply to it BEFORE the system or model is
        put into service or placed on the market. A frontier developer's internal
        evaluation of a model destined for release is product-oriented on any reading.
      - >-
        A SECOND RECITAL RUNNING AHEAD OF THE ENACTING TEXT, which matters more here than
        the point it is usually cited for. It speaks of 'those systems AND MODELS being
        PUT INTO SERVICE or placed on the market'. Art. 2(1)(a) has no put-into-service
        limb for models at all, and Art. 3, point (11) confines that term to AI systems.
        Recital 97 does the same thing. Two recitals presuppose a category the definitions
        do not provide, which is the strongest available evidence that the asymmetry in
        Art. 2(1)(a) is an artefact rather than a considered choice - and it cuts in
        favour of the Commission's reading without curing the fragility, because a recital
        still cannot derogate from enacting terms.
      - >-
        The closing 'without prejudice' clause names only 'an AI system falling into the
        scope of this Regulation', not a model. The asymmetry survives even here.

  - id: recital-97
    cite: "Recital 97"
    source_celex: "32024R1689"
    text: >-
      [...] It should be understood that the obligations for the providers of
      general-purpose AI models should apply once the general-purpose AI models are
      placed on the market. When the provider of a general-purpose AI model integrates
      an own model into its own AI system that is made available on the market or put
      into service, that model should be considered to be placed on the market and,
      therefore, the obligations in this Regulation for models should continue to apply
      in addition to those for AI systems. The obligations laid down for models should
      in any case not apply when an own model is used for purely internal processes
      that are not essential for providing a product or a service to third parties and
      the rights of natural persons are not affected. Considering their potential
      significantly negative effects, the general-purpose AI models with systemic risk
      should always be subject to the relevant obligations under this Regulation. The
      definition should not cover AI models used before their placing on the market for
      the sole purpose of research, development and prototyping activities [...] without
      prejudice to the obligation to comply with this Regulation when, following such
      activities, a model is placed on the market.
    notes:
      - >-
        THE WEIGHT-BEARING SOURCE OF THIS ANALYSIS, and the reason the route is the
        finding. The deemed-placement rule, the three-condition internal-use carve-out
        and the 'sole purpose' qualifier all sit here. None of the three appears in
        Article 3, point (63).
      - >-
        Reproduced verbatim by the Commission at Guidelines C(2025) 7719 final, para. 54
        (Section 3.1.3), which attributes the deemed-placement rule to this recital and
        nothing else.
      - >-
        Guidelines para. 53 quotes two further sentences of this recital: 'AI models are
        typically integrated into and form part of AI systems', and '[the] rules for
        general-purpose AI models and for general-purpose AI models that pose systemic
        risks, ... should apply also when these models are integrated or form part of an
        AI system'. Both corroborate that integration does not take a model out of the
        model regime.
      - >-
        A recital cannot derogate from enacting terms (Nilsson C-162/97; Manfredi
        C-308/97; Tyson Parketthandel C-134/08). That principle was applied against an
        earlier draft that relied on Recital 115; it applies here too, against the
        conclusion this analysis now supports. Stated, not resolved.

  - id: recital-114
    cite: "Recital 114"
    source_celex: "32024R1689"
    text: >-
      [...] this Regulation should require providers to perform the necessary model
      evaluations, in particular prior to its first placing on the market, including
      conducting and documenting adversarial testing of models, also, as appropriate,
      through internal or independent external testing. In addition, providers of
      general-purpose AI models with systemic risks should continuously assess and
      mitigate systemic risks, including for example by putting in place
      risk-management policies, such as accountability and governance processes,
      implementing post-market monitoring, taking appropriate measures along the
      entire model's lifecycle [...]

  - id: recital-115
    cite: "Recital 115"
    source_celex: "32024R1689"
    text: >-
      [...] If, despite efforts to identify and prevent risks related to a
      general-purpose AI model that may present systemic risks, the development or use
      of the model causes a serious incident, the general-purpose AI model provider
      should without undue delay keep track of the incident and report any relevant
      information and possible corrective measures to the Commission and national
      competent authorities. Furthermore, providers should ensure an adequate level of
      cybersecurity protection for the model and its physical infrastructure [...]
      Cybersecurity protection related to systemic risks associated with malicious use
      or attacks should duly consider accidental model leakage, unauthorised releases,
      circumvention of safety measures, and defence against cyberattacks, unauthorised
      access or model theft. That protection could be facilitated by securing model
      weights, algorithms, servers, and data sets, such as through operational security
      measures for information security, specific cybersecurity policies, adequate
      technical and established solutions, and cyber and physical access controls [...]
    enumerated_considerations:
      - "accidental model leakage"
      - "unauthorised releases"
      - "circumvention of safety measures"
      - "defence against cyberattacks"
      - "unauthorised access"
      - "model theft"
    notes:
      - >-
        'the development or use of the model causes a serious incident' — forecloses
        the argument that incidents arising in internal pre-deployment evaluation sit
        outside the reporting regime.
