  - id: cer-annex-8
    instrument: "CER"
    cite: "CER Annex, sector 8"
    title: "Annex — digital infrastructure: categories of entities"
    source_celex: "32022L2557"
    provenance: "authentic OJ"
    verified: "2026-09-12 against OJ L 333, 27.12.2022"
    text: >-
      [Third column, headed 'Categories of entities', sector 8 'Digital infrastructure':]
      Providers of internet exchange points as defined in Article 6, point (18), of
      Directive (EU) 2022/2555; DNS service providers as defined in Article 6, point (20),
