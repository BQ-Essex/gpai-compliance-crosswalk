    notes:
      - "The enforcement teeth behind the instrument; what Art. 91(4) requires be indicated."

  - id: art113
    cite: "Article 113"
    title: "Entry into force and application"
    amended_by_omnibus: true
    text: >-
      It shall apply from 2 August 2026. However: [...] (b) Chapter III Section 4,
      Chapter V, Chapter VII and Chapter XII and Article 78 shall apply from
      2 August 2025, with the exception of Article 101; (c) [▼M1] Chapter III,
      Sections 1, 2, and 3, with the exception of Article 6(5), shall apply from:
      (i) 2 December 2027 [Annex III high-risk]; and (ii) 2 August 2028 [Annex I
