    derivation:
      - "Chapter V (Arts 51-56) applies from 2025-08-02 — point (b), unamended ▼B."
      - >-
        Article 101 is excepted from point (b) and appears in no other point,
        therefore falls back on the general rule in the opening line:
        APPLIES FROM 2026-08-02. Derivable from the Act alone.

# Provisions of OTHER instruments that this Regulation imports by reference and that
# the analysis relies on the text of. They are held here, and checked by
# tools/citecheck.py, for the same reason the Act's own provisions are: a definition
# that resolves into another instrument is still doing work, and this one has produced
# three of the six recorded errors. Cite them in prose with the instrument qualifier —
# "CER Article 2, point (4)" — which is both how citecheck tells them apart and how a
# reader should have been able to tell all along.
  - id: art54
