# Verified statutory provisions.
#
# PROVENANCE: text extracted from the EUR-Lex consolidated version of Regulation
# (EU) 2024/1689, CELEX 02024R1689-20260727 (consolidation date 27 July 2026,
# incorporating Regulation (EU) 2026/1744, the "Digital Omnibus on AI").
# Recitals are NOT present in the consolidated version and are taken from the
# authentic Official Journal text, CELEX 32024R1689.
#
# amended_by_omnibus is recorded from the EUR-Lex change markers themselves
# (▼M1 = amended, ▼B = base text), not inferred from commentary.
#
# PROVENANCE is recorded per entry because it was not uniform while this was built.
# Entries marked
#   provenance: consolidated
# were read from the EUR-Lex consolidated text named above, change markers and all.
# Fourteen entries were first taken from a published reproduction, after EUR-Lex
# proved unreachable from the machine this was prepared on, and carried
# amended_by_omnibus "unverified" until the consolidated PDF could be obtained. On
# 12 September 2026 all fourteen were checked against it: thirteen matched verbatim,
# and the fourteenth differed only by a stray full stop that turned out to be the
# Regulation's own and has been restored. Each carries a "verified" field recording
# that check. The gap is closed; the history is left here rather than tidied away,
# because a register that never says how it was built is asking to be trusted.

meta:
  regulation: "Regulation (EU) 2024/1689"
  consolidated_celex: "02024R1689-20260727"
  consolidation_date: "2026-07-27"
  authentic_celex: "32024R1689"
  amending_act: "Regulation (EU) 2026/1744"
  extracted: "2026-09-11"
  extended: "2026-09-12"
  verified_against_consolidated: "2026-09-12"
  amendment_status_cross_checked: "2026-09-12 against the amending act itself, CELEX 32026R1744, not only the consolidated change markers"
  caveat: >-
    The EUR-Lex consolidated text carries the standing notice that it "is meant
    purely as a documentation tool and has no legal effect". Cite the
    consolidated text for currency of the enacting terms and the OJ publication
    as the authentic version.

provisions:
  - id: art2-1a
    cite: "Article 2(1), point (a)"
    title: "Scope — who the Regulation binds"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      This Regulation applies to: (a) providers placing on the market or putting into
      service AI systems or placing on the market general-purpose AI models in the
      Union, irrespective of whether those providers are established or located within
      the Union or in a third country;
    notes:
      - >-
        THE ASYMMETRY ON WHICH THE SCOPE ARGUMENT TURNS. AI systems are caught on
        placing on the market OR putting into service. General-purpose AI models are
        caught on placing on the market alone. 'Putting into service' at Art. 3(11)
        expressly includes supply 'for own use'; that limb is not extended to models.
      - >-
        Read with Arts. 3(9) and 3(10), a model never supplied to anyone is, on the
        enacting text alone, never placed on the market. Recital 97 answers this by
        relocating the moment of placement, not by creating an exception.

  - id: art2-6
    cite: "Article 2(6)"
    title: "Scope — scientific research and development exclusion"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      This Regulation does not apply to AI systems or AI models, including their output,
      specifically developed and put into service for the sole purpose of scientific
      research and development.
    notes:
      - >-
        Distinct from Art. 2(8) and narrower. It requires the SOLE purpose of scientific
        research and development, and it speaks of models 'put into service' — a term
        Art. 2(1)(a) does not apply to models. Not relied on here; recorded because the
        'sole purpose' formula appears in the enacting text at this provision and
        nowhere in Art. 3, point (63).

  - id: art2-8
    cite: "Article 2(8)"
    title: "Scope — research, testing and development exclusion"
    amended_by_omnibus: false
    text: >-
      This Regulation does not apply to any research, testing or development activity
      regarding AI systems or AI models prior to their being placed on the market or put
      into service. Such activities shall be conducted in accordance with applicable Union
      law. Testing in real world conditions shall not be covered by that exclusion.
    notes:
      - "THE OPERATIVE SCOPE EXCLUSION. Not consulted in the first draft of this analysis."
      - "The final sentence is the only route back into scope for development-stage conduct."
      - "A recital cannot derogate from this — Nilsson C-162/97; Manfredi C-308/97; Tyson Parketthandel C-134/08."

  - id: art3-1
    cite: "Article 3, point (1)"
    title: "Definition — 'AI system'"
    amended_by_omnibus: false
    text: >-
      'AI system' means a machine-based system that is designed to operate with varying
      levels of autonomy and that may exhibit adaptiveness after deployment, and that, for
      explicit or implicit objectives, infers, from the input it receives, how to generate
      outputs such as predictions, content, recommendations, or decisions that can influence
      physical or virtual environments;
    notes:
      - >-
        Art. 3(49) defines 'serious incident' by reference to an AI SYSTEM, while
        Art. 55(1)(c) binds providers of MODELS. The Act does not expressly bridge these.

  - id: art3-3
    cite: "Article 3, point (3)"
    title: "Definition — 'provider'"
    amended_by_omnibus: false
    text: >-
      'provider' means a natural or legal person, public authority, agency or other body
      that develops an AI system or a general-purpose AI model or that has an AI system or
      a general-purpose AI model developed and places it on the market or puts the AI system
      into service under its own name or trademark, whether for payment or free of charge;
    notes:
      - "Art. 52(1) binds 'the relevant provider'. The temporal trigger is capability; STANDING is tied to placing on the market."

  - id: art3-9
    cite: "Article 3, point (9)"
    title: "Definition — 'placing on the market'"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    corroborated_by: >-
      Commission Guidelines C(2025) 7719 final, para. 47, which quotes this definition
      as applied to a general-purpose AI model.
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      'placing on the market' means the first making available of an AI system or a
      general-purpose AI model on the Union market;
    notes:
      - >-
        The only trigger the Regulation applies to general-purpose AI models at
        Art. 2(1)(a). It defers entirely to Art. 3(10).

  - id: art3-10
    cite: "Article 3, point (10)"
    title: "Definition — 'making available on the market'"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    corroborated_by: >-
      Commission Guidelines C(2025) 7719 final, para. 47.
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      'making available on the market' means the supply of an AI system or a
      general-purpose AI model for distribution or use on the Union market in the course
      of a commercial activity, whether in return for payment or free of charge;
    notes:
      - >-
        'Supply' and 'in the course of a commercial activity' are the two words a
        provider would rely on. A model that never leaves the developer is not supplied
        to anyone, and the Guidelines at para. 51 answer this not by reading 'supply'
        loosely but by treating essential internal use as itself an example of placement.

  - id: art3-11
    cite: "Article 3, point (11)"
    title: "Definition — 'putting into service'"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      'putting into service' means the supply of an AI system for first use directly to
      the deployer or for own use in the Union for its intended purpose;
    notes:
      - >-
        'or for own use' is express, and it is confined to AI SYSTEMS. Art. 2(1)(a) does
        not apply this trigger to models. The asymmetry is therefore deliberate on the
        face of the text, which is what makes the textual reading available to a provider.

  - id: art3-47
    cite: "Article 3, point (47)"
    title: "Definition — 'AI Office'"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      'AI Office' means the Commission's function of contributing to the implementation,
      monitoring and supervision of AI systems and general-purpose AI models, and AI
      governance, provided for in Commission Decision of 24 January 2024; references in
      this Regulation to the AI Office shall be construed as references to the Commission;
    notes:
      - >-
        DECISIVE FOR THE INSTRUMENT. The AI Office is a function of the Commission, not a
        legal person, so an Art. 91 request is issued in the Commission's name. An earlier
        draft of the instrument was issued in the AI Office's name and was ultra vires on
        its face.
      - >-
        Guidelines para. 6 states that the Commission has exclusive competence to enforce
        Chapter V, its implementation entrusted to the AI Office.

  - id: art3-49
    cite: "Article 3, point (49)"
    title: "Definition — 'serious incident'"
    amended_by_omnibus: false
    text: >-
      'serious incident' means an incident or malfunctioning of an AI system that
      directly or indirectly leads to any of the following: (a) the death of a
      person, or serious harm to a person's health; (b) a serious and irreversible
      disruption of the management or operation of critical infrastructure;
      (c) the infringement of obligations under Union law intended to protect
      fundamental rights; (d) serious harm to property or the environment;
    notes:
      - "Causal standard is broad: 'directly or indirectly leads to'."
      - "Limbs are disjunctive — one suffices."
      - "ONLY limb (b) carries an irreversibility requirement. Limb (d) does not."
      - "Limb (b) is not self-contained: depends on art3-62."

  - id: art3-57
    cite: "Article 3, point (57)"
    title: "Definition — 'testing in real-world conditions'"
    amended_by_omnibus: false
    text: >-
      'testing in real-world conditions' means the temporary testing of an AI system for its
      intended purpose in real-world conditions outside a laboratory or otherwise simulated
      environment, with a view to gathering reliable and robust data and to assessing and
      verifying the conformity of the AI system with the requirements of this Regulation, and
      it does not qualify as placing the AI system on the market or putting it into service
      within the meaning of this Regulation, provided that all the conditions laid down in
      Article 57 or 60 are fulfilled;
    notes:
      - "Every element describes an ELECTED activity: temporary, intended purpose, outside a laboratory by design, Art. 57/60 conditions."
      - "Drafted for exposure that is chosen. Does not reach exposure that occurs."

  - id: art3-62
    cite: "Article 3, point (62)"
    title: "Definition — 'critical infrastructure'"
    amended_by_omnibus: false
    text: >-
      'critical infrastructure' means critical infrastructure as defined in
      Article 2, point (4), of Directive (EU) 2022/2557;
    external_reference:
      instrument: "Directive (EU) 2022/2557 (CER Directive)"
      celex: "32022L2557"
      art_2_4: >-
        'critical infrastructure' means an asset, a facility, equipment, a network
        or a system, or a part of an asset, a facility, equipment, a network or a
        system, which is necessary for the provision of an essential service;
      art_2_5: >-
        'essential service' means a service which is crucial for the maintenance of
        vital societal functions, economic activities, public health and safety, or
        the environment;
      art_2_1_contrast: >-
        'critical entity' means a public or private entity which has been identified
        by a Member State in accordance with Article 6 as belonging to one of the
        categories set out in the third column of the table in the Annex;
    notes:
      - >-
        CORRECTION OF A COMMON ERROR: designation attaches to 'critical ENTITY'
        (Art. 2(1)). The AI Act imports Art. 2(4), 'critical INFRASTRUCTURE',
        which is defined FUNCTIONALLY. No Member State designation is required.
      - "Consequence: limb (b) is arguable on the functional test, and fails (if at all) on 'irreversible'."

  - id: art3-63
    cite: "Article 3, point (63)"
    title: "Definition — 'general-purpose AI model'"
    amended_by_omnibus: false
    text: >-
      'general-purpose AI model' means an AI model, including where such an AI model is
      trained with a large amount of data using self-supervision at scale, that displays
      significant generality and is capable of competently performing a wide range of
      distinct tasks regardless of the way the model is placed on the market and that can be
      integrated into a variety of downstream systems or applications, except AI models that
      are used for research, development or prototyping activities before they are placed on
      the market;
    notes:
      - "THE EXCLUSION IS INSIDE THE DEFINED TERM. Not an exemption from obligations — outside the term Chapter V operates on."
      - "Consequence: Arts. 51, 52, 53, 55 cannot attach, and Art. 91 cannot reach the documentation."

  - id: art3-66
    cite: "Article 3, point (66)"
    title: "Definition — 'general-purpose AI system'"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      'general-purpose AI system' means an AI system which is based on a general-purpose
      AI model and which has the capability to serve a variety of purposes, both for
      direct use as well as for integration in other AI systems;
    notes:
      - >-
        The Act keeps system and model apart as defined terms throughout. This is why the
        bridging gap at Art. 55(1)(c) is real: 'serious incident' at Art. 3, point (49) is
        defined by reference to an AI system (Art. 3, point (1)), while Art. 55(1)(c)
        binds providers of models.

  - id: art50
    cite: "Article 50"
    title: "Transparency obligations for providers and deployers of certain AI systems"
    amended_by_omnibus: "True"
    provenance: "not reproduced"
    verified: "2026-09-12 — amendment status from CELEX 32026R1744, instruction (20), replacing paragraph 7"
    text: >-
      [Text not reproduced. This analysis does not rely on Article 50's wording. It is
      held so that the Commission's published conclusion that the Code of Practice on
      Transparency of AI-generated Content "adequately covers the obligations provided for
      in Articles 50(2), (4) and (5)" resolves to a provision in the register rather than
      dangling. That conclusion is cited as a comparator for the Article 56(6) assessment
      shape, not for anything Article 50 requires.]

  - id: annex-xiii
    cite: "Annex XIII"
    title: "Criteria for the designation of general-purpose AI models with systemic risk"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727"
    text: >-
      For the purpose of determining that a general-purpose AI model has capabilities or an
      impact equivalent to those set out in Article 51(1), point (a), the Commission shall
      take into account the following criteria: (a) the number of parameters of the model;
      (b) the quality or size of the data set, for example measured through tokens; (c) the
      amount of computation used for training the model, measured in floating point
      operations or indicated by a combination of other variables such as estimated cost of
      training, estimated time required for the training, or estimated energy consumption
      for the training; (d) the input and output modalities of the model, such as text to
      text (large language models), text to image, multi-modality, and the state of the art
      thresholds for determining high-impact capabilities for each modality, and the
      specific type of inputs and outputs (e.g. biological sequences); (e) the benchmarks
      and evaluations of capabilities of the model, including considering the number of
      tasks without additional training, adaptability to learn new, distinct tasks, its
      level of autonomy and scalability, the tools it has access to; (f) whether it has a
      high impact on the internal market due to its reach, which shall be presumed when it
      has been made available to at least 10 000 registered business users established in
      the Union; (g) the number of registered end-users.
    notes:
      - >-
        "SHALL TAKE INTO ACCOUNT", not shall satisfy. The criteria are factors in a
        judgement, not cumulative conditions, which matters because only one of them is
        evidenced by the public record here.
      - >-
        CRITERION (e) IS ABOUT DEMONSTRATED CAPABILITY, and names "its level of autonomy
        and scalability, the tools it has access to". Criterion (c) is the compute figure
        this analysis cannot obtain. The Commission is not confined to (c).
      - >-
        Criterion (f)'s reach presumption - 10 000 registered business users in the Union -
        cuts against a model never released, and for the deployed one.

  - id: art51
    cite: "Article 51"
    title: "Classification as GPAI model with systemic risk"
    amended_by_omnibus: false
    text: >-
      1. A general-purpose AI model shall be classified as a general-purpose AI
      model with systemic risk if it meets any of the following conditions: (a) it
      has high impact capabilities evaluated on the basis of appropriate technical
      tools and methodologies, including indicators and benchmarks; (b) based on a
      decision of the Commission, ex officio or following a qualified alert from the
      scientific panel, it has capabilities or an impact equivalent to those set out
      in point (a) having regard to the criteria set out in Annex XIII.
      2. A general-purpose AI model shall be presumed to have high impact
      capabilities pursuant to paragraph 1, point (a), when the cumulative amount of
      computation used for its training measured in floating point operations is
      greater than 10^25.
    notes:
      - "51(1)(b) designation may follow a QUALIFIED ALERT FROM THE SCIENTIFIC PANEL."
      - "51(2) presumption threshold: >10^25 FLOP."

  - id: art52-1
    cite: "Article 52(1)"
    title: "Procedure — notification duty"
    amended_by_omnibus: false
    text: >-
      Where a general-purpose AI model meets the condition referred to in Article
      51(1), point (a), the relevant provider shall notify the Commission without
      delay and in any event within two weeks after that requirement is met or it
      becomes known that it will be met. That notification shall include the
      information necessary to demonstrate that the relevant requirement has been
      met. If the Commission becomes aware of a general-purpose AI model presenting
      systemic risks of which it has not been notified, it may decide to designate
      it as a model with systemic risk.
    notes:
      - "THE ONLY DETERMINATE DEADLINE IN THE GPAI SYSTEMIC-RISK REGIME: two weeks."
      - "Trigger is CAPABILITY, not placing on the market."
      - "Expressly forward-looking: 'or it becomes known that it will be met'."
      - "Final sentence supplies the remedy: ex officio designation where unnotified."

  - id: art52-2
    cite: "Article 52(2)"
    title: "Rebutting the systemic-risk presumption"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727"
    text: >-
      The provider of a general-purpose AI model that meets the condition referred to in
      Article 51(1), point (a), may present, with its notification, sufficiently
      substantiated arguments to demonstrate that, exceptionally, although it meets that
      requirement, the general-purpose AI model does not present, due to its specific
      characteristics, systemic risks and therefore should not be classified as a
      general-purpose AI model with systemic risk.
    notes:
      - >-
        READ THE TRIGGER CAREFULLY. This route is available to a provider whose model
        meets Art. 51(1), point (a) - the capability/compute limb - and it is presented
        "with its notification". It is a rebuttal of the presumption, not a general right
        of reply. Article 52 says nothing about rebutting a Commission DESIGNATION under
        Art. 51(1), point (b), and an earlier draft of the report assumed it did.

  - id: art52-3
    cite: "Article 52(3)"
    title: "Rejection of the provider's arguments"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727"
    text: >-
      Where the Commission concludes that the arguments submitted pursuant to paragraph 2
      are not sufficiently substantiated and the relevant provider was not able to
      demonstrate that the general-purpose AI model does not present, due to its specific
      characteristics, systemic risks, it shall reject those arguments, and the
      general-purpose AI model shall be considered to be a general-purpose AI model with
      systemic risk.
    notes:
      - >-
        "was not able to demonstrate" puts the burden on the provider once the presumption
        is engaged.

  - id: art53-1a
    cite: "Article 53(1), point (a)"
    title: "Technical documentation"
    amended_by_omnibus: false
    text: >-
      Providers of general-purpose AI models shall: draw up and keep up-to-date the
      technical documentation of the model, including its training and testing
      process and the results of its evaluation, which shall contain, at a minimum,
      the information set out in Annex XI for the purpose of providing it, upon
      request, to the AI Office and the national competent authorities;
    notes:
      - "Named expressly in Article 91(1) as reachable by a request for information."

  - id: art55-1a
    cite: "Article 55(1), point (a)"
    title: "Model evaluation and documented adversarial testing"
    amended_by_omnibus: false
    text: >-
      perform model evaluation in accordance with standardised protocols and tools
      reflecting the state of the art, including conducting and documenting
      adversarial testing of the model with a view to identifying and mitigating
      systemic risks;
    recital: recital-114

  - id: art55-1b
    cite: "Article 55(1), point (b)"
    title: "Systemic risk assessment at Union level"
    amended_by_omnibus: false
    text: >-
      assess and mitigate possible systemic risks at Union level, including their
      sources, that may stem from the development, the placing on the market, or the
      use of general-purpose AI models with systemic risk;
    recital: recital-114
    notes:
      - "'at Union level, including their sources' — expressly not a single-provider frame."

  - id: art55-1c
    cite: "Article 55(1), point (c)"
    title: "Serious incident tracking, documentation and reporting"
    amended_by_omnibus: false
    text: >-
      keep track of, document, and report, without undue delay, to the AI Office and,
      as appropriate, to national competent authorities, relevant information about
      serious incidents and possible corrective measures to address them;
    recital: recital-115
    notes:
      - "THREE VERBS, separately testable: keep track of / document / report."
      - "Obligation extends to 'possible corrective measures to address them'."
      - "NO determinate period — only 'without undue delay'. Contrast art52-1 and art73."

  - id: art55-1d
    cite: "Article 55(1), point (d)"
    title: "Cybersecurity protection"
    amended_by_omnibus: false
    text: >-
      ensure an adequate level of cybersecurity protection for the general-purpose AI
      model with systemic risk and the physical infrastructure of the model.
    recital: recital-115
    notes:
      - "Recital 115 enumerates what this must 'duly consider' — see recital-115."

  - id: art55-2
    cite: "Article 55(2)"
    title: "Compliance route — code of practice or alternative means"
    amended_by_omnibus: false
    text: >-
      Providers of general-purpose AI models with systemic risk may rely on codes of
      practice within the meaning of Article 56 to demonstrate compliance with the
      obligations set out in paragraph 1 of this Article, until a harmonised standard
      is published. [...] Providers [...] who do not adhere to an approved code of
      practice or do not comply with a European harmonised standard shall demonstrate
      alternative adequate means of compliance for assessment by the Commission.
    notes:
      - "EITHER branch guarantees a requestable artifact exists."

  - id: art55-3
    cite: "Article 55(3)"
    title: "Confidentiality"
    amended_by_omnibus: false
    text: >-
      Any information or documentation obtained pursuant to this Article, including
      trade secrets, shall be treated in accordance with the confidentiality
      obligations set out in Article 78.
    notes:
      - "Forecloses the trade-secret objection: confidentiality is handled on receipt."

  - id: art56
    cite: "Article 56"
    title: "Codes of practice"
    amended_by_omnibus: "True"
    provenance: "consolidated (extract)"
    verified: "2026-09-12 against CELEX 02024R1689-20260727 and the amending act CELEX 32026R1744, instruction (21)"
    text: >-
      [Paragraph 6, as replaced by Regulation (EU) 2026/1744:] The Commission and the Board
      shall regularly monitor and evaluate the achievement of the objectives of the codes
      of practice by the participants and their contribution to the proper application of
      this Regulation. The Commission, taking utmost account of the opinion of the Board,
      shall assess whether the codes of practice cover the obligations provided for in
      Articles 53 and 55, and shall regularly monitor and evaluate the achievement of their
      objectives. The Commission shall publish its assessment of the adequacy of the codes
      of practice.
    notes:
      - >-
        REINSTATED, having been removed on 12 September as an entry nothing cited. That was
        a mistake made on tooling grounds rather than legal ones: reading the amending act
        shows this is the ONE provision inside Chapter V that the Omnibus touched, and what
        it adds bears directly on Art. 55(2).
      - >-
        The amended paragraph obliges the Commission to assess whether the codes of practice
        COVER THE OBLIGATIONS IN ARTICLES 53 AND 55, and to PUBLISH that assessment. A
        provider relying on the Code under Art. 55(2) is therefore relying on an instrument
        the Commission is now under a duty to assess and to publish its assessment of. Ask
        for that assessment.
      - >-
        Chapter V runs from Article 51 to Article 56. The obligation provisions - 51, 52, 53,
        54 and 55 - are untouched by the Omnibus. Article 56(6) is the exception, and the
        claim that "Chapter V is untouched" was made in this project's own working notes
        before the amending act was read.

  - id: art57
    cite: "Article 57"
    title: "AI regulatory sandboxes"
    amended_by_omnibus: "True"
    provenance: "consolidated (extract)"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      [Paragraph 1, first sentence:] Member States shall ensure that their competent
      authorities establish at least one AI regulatory sandbox at national level, which
      shall be operational by 2 August 2027. [...]
    notes:
      - >-
        A sandbox under this article is a supervised national scheme that a provider
        enters. It is not a description of a developer's own evaluation environment, and
        an escape from the latter is not an event within the former.
      - >-
        THE ONLY ONE OF THESE PROVISIONS THE OMNIBUS TOUCHED. Paragraph 1 carries an M1
        marker: as amended it requires at least one national sandbox operational by
        2 August 2027, permits joint establishment with the authorities of other Member
        States, and allows the Commission to provide technical support, advice and tools.
        The extract above is the amended text.

  - id: art60
    cite: "Article 60"
    title: "Testing of high-risk AI systems in real world conditions outside AI regulatory sandboxes"
    amended_by_omnibus: "True"
    provenance: "consolidated (extract)"
    verified: "2026-09-12 against CELEX 02024R1689-20260727, and against the amending act CELEX 32026R1744, instruction (24)"
    text: >-
      [Paragraph 1, first sentence:] Testing of high-risk AI systems in real world
      conditions outside AI regulatory sandboxes may be conducted by providers or
      prospective providers of high-risk AI systems listed in Annex III or covered by
      Union harmonisation legislation listed in Section A of Annex I [...]
    notes:
      - >-
        SHARPENS THE TEXTUAL READING. Article 2(8)'s single carve-back is 'testing in
        real world conditions', defined at Art. 3, point (57) by reference to an AI
        SYSTEM and operationalised here for HIGH-RISK AI SYSTEMS alone. The carve-back
        has no purchase on a general-purpose AI model, so on the enacting text Art. 2(8)
        excludes pre-market model development without relevant exception.
      - >-
        This does not defeat the Commission's reading. Recital 97 works by relocating the
        moment of placement, so that the development is not 'prior to' placing on the
        market and Art. 2(8) never engages. That is the coherent account of how the two
        provisions sit together, and it is worth stating because it shows the recital
        doing structural work the definition does not.
      - >-
        FLAG CORRECTED. This entry read amended_by_omnibus "False" for a few hours. The
        Omnibus replaces paragraph 1's first subparagraph and the whole of paragraph 2
        (Regulation (EU) 2026/1744, instruction (24)). The words quoted above survive the
        replacement unchanged - the amendment adds "in accordance with this Article and
        the real-world testing plan referred to in this Article, without prejudice to the
        prohibitions under Article 5" - so the argument built on them is unaffected, but
        the flag was wrong and the method that produced it was worse: amendment status had
        been derived by finding the nearest preceding change marker in the consolidated
        text, and the anchor phrase used to locate this provision is also its own ARTICLE
        HEADING, so the search matched the heading and read the marker before it. Status is
        now taken from the amending act's own list of instructions, which cannot be
        confused by a heading.

  - id: art68-2
    cite: "Article 68(2)"
    title: "Scientific panel — composition and independence"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      The scientific panel shall consist of experts selected by the Commission on the
      basis of up-to-date scientific or technical expertise in the field of AI necessary
      for the tasks set out in paragraph 3, and shall be able to demonstrate meeting all
      of the following conditions: (a) having particular expertise and competence and
      scientific or technical expertise in the field of AI; (b) independence from any
      provider of AI systems or general-purpose AI models; (c) an ability to carry out
      activities diligently, accurately and objectively. The Commission, in consultation
      with the Board, shall determine the number of experts on the panel in accordance
      with the required needs and shall ensure fair gender and geographical representation.
    notes:
      - >-
        Article 91(3) conditions a panel-initiated request for information on the
        fulfilment of 'the tasks of the scientific panel under Article 68(2)'. Paragraph
        (2) sets out composition and independence; the TASKS are at paragraph (3). The
        cross-reference as enacted points at the wrong paragraph.

  - id: art68-3
    cite: "Article 68(3)"
    title: "Scientific panel — tasks"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      The scientific panel shall advise and support the AI Office, in particular with
      regard to the following tasks: (a) supporting the implementation and enforcement of
      this Regulation as regards general-purpose AI models and systems, in particular by:
      (i) alerting the AI Office of possible systemic risks at Union level of
      general-purpose AI models, in accordance with Article 90; (ii) contributing to the
      development of tools and methodologies for evaluating capabilities of
      general-purpose AI models and systems, including through benchmarks; (iii)
      providing advice on the classification of general-purpose AI models with systemic
      risk; (iv) providing advice on the classification of various general-purpose AI
      models and systems; (v) contributing to the development of tools and templates; (b)
      supporting the work of market surveillance authorities, at their request; (c)
      supporting cross-border market surveillance activities as referred to in Article
      74(11), without prejudice to the powers of market surveillance authorities; (d)
      supporting the AI Office in carrying out its duties in the context of the Union
      safeguard procedure pursuant to Article 81.
    notes:
      - >-
        The tasks Article 91(3) must mean to refer to. Point (a)(i) is the alerting task
        that Article 90 governs, which is the pathway the instrument names in the
        alternative.

  - id: art73
    cite: "Article 73"
    title: "Reporting of serious incidents (high-risk AI systems)"
    amended_by_omnibus: false
    text: >-
      1. Providers of high-risk AI systems placed on the Union market shall report any
      serious incident to the market surveillance authorities of the Member States
      where that incident occurred.
      2. [...] immediately after the provider has established a causal link [...] and,
      in any event, not later than 15 days after [...] becomes aware [...].
      3. [...] in the event of a widespread infringement or a serious incident as
      defined in Article 3, point (49)(b) [...] immediately, and not later than two
      days [...].
      4. [...] in the event of the death of a person, the report shall be provided
      immediately after [...] established, or as soon as it suspects, a causal
      relationship [...], but not later than 10 days after [...] becomes aware [...].
    notes:
      - "Binds HIGH-RISK SYSTEM providers only — not GPAI model providers."
      - "Determinate periods: 15 days (73(2)) / 2 days (73(3), limb (b) only) / 10 DAYS (73(4), death)."
      - "CORRECTED: an earlier draft recorded 73(4) as 'immediately'. 'Immediately' is the floor in each tier, not the limit."
      - "Do not propose importing the scheme wholesale: the 2-day tier attaches only to Art. 3(49)(b), so facts in limb (d) get the SLOWEST tier."
      - "Chapter III §§1-3 deferred to 2027-12-02 and 2028-08-02 by amended Art. 113(c)."

  - id: art75-1
    cite: "Article 75(1)"
    title: "Exclusive competence of the AI Office"
    amended_by_omnibus: "True"
    provenance: "consolidated"
    text: >-
      1. The AI Office shall be exclusively competent for the supervision and enforcement
      of the obligations under this Regulation in relation to the following AI systems:
      (a) AI systems based on general-purpose AI models where the model and the system are
      developed by the same provider, or by providers forming part of the same undertaking
      as that provider, with the exception of: (i) AI systems related to products covered
      by the Union harmonisation legislation listed in Annex I; (ii) AI systems referred to
      in point 2 of Annex III; (iii) AI systems provided by law enforcement authorities,
      border management authorities and financial institutions, insofar as those AI systems
      fall under Article 74(6); and (iv) AI systems referred to in point 8 of Annex III as
      regards the administration of justice; (b) AI systems that constitute or that are
      integrated into a very large online platform or very large online search engine
      designated in accordance with Regulation (EU) 2022/2065. The exclusive competence
      referred to in the first subparagraph shall apply to the providers of those systems.
      It shall apply to the deployers of those systems only when they are also the provider
      or form part of the same undertaking as the provider.
    notes:
      - >-
        Where the model and the system come from the same provider, supervision of both
        sits with the AI Office. That is the same fact pattern Recital 97 deems to be
        placing on the market, approached from the enforcement side.

  - id: art75-1a
    cite: "Article 75(1a)"
    title: "Derogation — AI Office as addressee for GPAI-based high-risk systems"
    amended_by_omnibus: true
    text: >-
      By way of derogation from Article 73, providers of high-risk AI systems subject
      to the competence of the AI Office pursuant to paragraph 1 of this Article shall
      report any serious incidents to the AI Office. Article 73(2) to (9) shall apply
      mutatis mutandis. The AI Office shall promptly transmit the relevant information
      to the market surveillance authority of the Member State in the territory of
      which the provider or its legal representative is situated.
    notes:
      - "INSERTED BY THE OMNIBUS (▼M1)."
      - >-
        Creates the asymmetry: a high-risk GPAI-based system reports to the AI Office
        WITH Article 73's day-counts; the model-level duty at art55-1c has the same
        addressee and NO period at all.
      - "Art. 75(1) also gives the AI Office EXCLUSIVE competence over systems built on the provider's own model."

  - id: art78
    cite: "Article 78"
    title: "Confidentiality"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      1. The Commission, market surveillance authorities and notified bodies and any
      other natural or legal person involved in the application of this Regulation shall,
      in accordance with Union or national law, respect the confidentiality of information
      and data obtained in carrying out their tasks and activities in such a manner as to
      protect, in particular: (a) the intellectual property rights and confidential
      business information or trade secrets of a natural or legal person, including source
      code, except in the cases referred to in Article 5 of Directive (EU) 2016/943 [...];
      (b) the effective implementation of this Regulation, in particular for the purposes
      of inspections, investigations or audits; (c) public and national security
      interests; (d) the conduct of criminal or administrative proceedings; (e)
      information classified pursuant to Union or national law. 2. The authorities
      involved in the application of this Regulation pursuant to paragraph 1 shall request
      only data that is strictly necessary [...] and shall delete the data collected as
      soon as it is no longer needed for the purpose for which it was obtained [...]
    notes:
      - >-
        What the instrument can offer its addressee. Article 55(3) routes information
        obtained under Chapter V through this article, trade secrets expressly included,
        which is why the instrument asks the Provider to identify sensitive material
        rather than withhold it.
      - >-
        Paragraph 2's necessity limit cuts both ways: it also disciplines the drafting of
        a request. A request for everything is not a request for what is strictly
        necessary.

  - id: art90
    cite: "Article 90"
    title: "Scientific panel alerts of systemic risks"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      1. The scientific panel may provide a qualified alert to the AI Office where it has
      reason to suspect that: (a) a general-purpose AI model poses concrete identifiable
      risk at Union level; or (b) a general-purpose AI model meets the conditions referred
      to in Article 51. 2. Upon such qualified alert, the Commission, through the AI
      Office and after having informed the Board, may exercise the powers laid down in
      this Section for the purpose of assessing the matter. The AI Office shall inform the
      Board of any measure according to Articles 91 to 94. [Paragraph 3, setting out what
      a qualified alert must contain, is not reproduced here.]
    notes:
      - >-
        Limb (b) is the route that matters on these facts: a qualified alert may be given
        where the panel suspects a model MEETS the Art. 51 conditions. It does not require
        the model to have been notified, or placed on the market, first.
      - >-
        This is the pathway the instrument names in the alternative under Art. 91(3).

  - id: art91
    cite: "Article 91"
    title: "Power to request documentation and information"
    amended_by_omnibus: false
    text: >-
      1. The Commission may request the provider of the general-purpose AI model
      concerned to provide the documentation drawn up by the provider in accordance
      with Articles 53 and 55, or any additional information that is necessary for the
      purpose of assessing compliance of the provider with this Regulation.
      2. Before sending the request for information, the AI Office may initiate a
      structured dialogue with the provider of the general-purpose AI model.
      3. Upon a duly substantiated request from the scientific panel, the Commission
      may issue a request for information to a provider of a general-purpose AI model,
      where the access to information is necessary and proportionate for the
      fulfilment of the tasks of the scientific panel under Article 68(2).
      4. The request for information shall state the legal basis and the purpose of the
      request, specify what information is required, set a period within which the
      information is to be provided, and indicate the fines provided for in Article 101
      for supplying incorrect, incomplete or misleading information.
      5. The provider [...] or its representative shall supply the information
      requested. [...] Lawyers duly authorised to act may supply information on behalf
      of their clients. The clients shall nevertheless remain fully responsible if the
      information supplied is incomplete, incorrect or misleading.
    mandatory_elements:
      - "legal basis"
      - "purpose of the request"
      - "specification of information required"
      - "period for response"
      - "indication of Article 101 fines"
    notes:
      - "TWO activation pathways: 91(1) own-initiative; 91(3) scientific panel."

  - id: art101-1a
    cite: "Article 101(1), point (a)"
    title: "Fines for providers of general-purpose AI models — substantive infringement"
    amended_by_omnibus: "False"
    provenance: "consolidated"
    verified: "2026-09-12 against CELEX 02024R1689-20260727; change marker read directly"
    text: >-
      The Commission may impose on providers of general-purpose AI models fines not
      exceeding 3 % of their annual total worldwide turnover in the preceding financial
      year or EUR 15 000 000, whichever is higher., when the Commission finds that the
      provider intentionally or negligently: (a) infringed the relevant provisions of this
      Regulation;
    notes:
      - >-
        Article 113 brings Article 101 into application on 2 August 2026. Conduct in July
        2026 therefore carries no exposure under point (a), which is a real limit on what
        an enforcement response to these episodes could achieve and is stated in the
        report rather than left for a reader to find.
      - >-
        Point (b) — failure to comply with an Art. 91 request — is unaffected by that
        timing, because the request would be issued now. See art101-1b.
      - >-
        TRANSCRIBED AS PRINTED, stray full stop included: “whichever is higher., when the
        Commission finds”. Earlier entries here silently tidied it, which is the small
        version of the thing this project is against. The oddity stands in the authentic
        OJ text at CELEX 32024R1689 and in the consolidated text at 02024R1689-20260727
        alike, so it is the Regulation's and not an artefact of extraction.
      - >-
        A second and more substantive slip sits in the closing subparagraph of Article
        101(1), which reads “The Commission shall also into account commitments made in
        accordance with Article 93(3) or made in relevant codes of practice in accordance
        with Article 56”. A verb is missing. Both EUR-Lex texts carry it. Nothing turns on
        it—there is only one way to read it—but it is recorded because this analysis
        claims to have read the enacting text rather than a summary of it, and this is
        what that looks like.

  - id: art101-1b
    cite: "Article 101(1), point (b)"
    title: "Fines — failure to comply with an Article 91 request"
    amended_by_omnibus: false
    text: >-
      The Commission may impose on providers of general-purpose AI models fines not
      exceeding 3 % of their annual total worldwide turnover in the preceding financial
