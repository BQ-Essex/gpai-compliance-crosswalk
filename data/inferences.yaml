# The argumentative steps, enumerated.
#
# Citations resolve and quotations match. Neither says whether a step FOLLOWS, and every
# error in this project's corrections log was a step that did not follow while every
# mechanical check passed. The response is not to pretend soundness is decidable. It is
# to stop letting inferences hide in prose.
#
# This file does for reasoning what the facts/characterisation split did for evidence and
# the verdict/conclusion_of_law split did for legal conclusions: gives the failure its own
# cell, so it can be looked at. A reader who wants to attack this analysis should be able
# to read a dozen numbered claims rather than five thousand words, and find the weak one
# in ten minutes rather than not at all.
#
# Each entry carries:
#   claim         the step, in one sentence, stated so it could be denied
#   type          what kind of move it is — the honest label, not the flattering one
#   premises      provision, recital or source ids it rests on; all must resolve
#   depends_on    other inferences it needs; the graph must be acyclic
#   defeater      what would show it wrong. An inference whose author cannot name one
#                 has usually not been thought through
#   strength      strong | moderate | contestable — and contestable is not a confession,
#                 it is a direction to the reader
#   load_bearing  true if the report's conclusion changes when this step fails
#   function      step | graded — whether the provision behaves as a threshold or a
#                 spectrum. The Act is genuinely both, and the distinction is not
#                 cosmetic: a step inference is brittle, flipping wholly on one fact
#                 (10^25 FLOP, 2 August 2026, "serious AND IRREVERSIBLE"), while a
#                 graded one degrades — a reader who disagrees with it moves the
#                 conclusion rather than breaking it. Marking them tells a reader which
#                 of these conclusions a single new fact could overturn.
#
# strength is the author's own estimate and is the softest thing here. It is recorded
# anyway, because an unranked list of claims invites a reader to attack the easiest
# rather than the most important, and this analysis would rather be attacked well.

inferences:
  - id: inf-asymmetry
    claim: >-
      Article 2(1), point (a) catches AI systems on placing on the market OR putting into
      service, but general-purpose AI models on placing on the market alone, and that
      difference is on the face of the enacting text rather than an artefact of reading.
    type: textual
    function: step
    premises: [art2-1a, art3-9, art3-10, art3-11]
    depends_on: []
    defeater: >-
      Any enacting provision applying a putting-into-service trigger to models. Article
      2(1), points (b) to (g) were read for this and none does.
    strength: strong
    load_bearing: true
    stated_at: "docs/report-draft.md §5.1 step one"

  - id: inf-carveback-unreachable
    claim: >-
      Article 2(8)'s single carve-back cannot reach a general-purpose AI model, because
      'testing in real world conditions' is defined at Article 3, point (57) by reference
      to an AI SYSTEM and the conditions it defers to are Article 57's national sandboxes
      and Article 60, which is confined on its face to HIGH-RISK AI SYSTEMS.
    type: textual
    function: step
    premises: [art2-8, art3-57, art57, art60]
    depends_on: []
    defeater: >-
      Any route by which a model could satisfy the Article 57 or 60 conditions. If one
      exists the textual reading weakens and Article 2(8) acquires an exception that
      could, on some facts, be elected.
    strength: strong
    load_bearing: false
    stated_at: "docs/report-draft.md §5.1 step three; protocol/01-statutory-foundation.md §1.3"

  - id: inf-relocation
    claim: >-
      Recital 97 does not except Article 2(8); it relocates the moment of placement, so
      that the development was never activity 'prior to' placing on the market and Article
      2(8) never engages.
    type: harmonising construction
    function: step
    premises: [recital-97, art2-8, recital-25]
    depends_on: [inf-carveback-unreachable]
    defeater: >-
      A reading on which Article 2(8) still bites after deemed placement, which would put
      the recital in conflict with the enacting text rather than in sequence with it. The
      Commission's Q&A treats development-phase duties as applying, which is evidence
      against that reading but is not enacting text.
    strength: moderate
    load_bearing: true
    stated_at: "docs/report-draft.md §5.1; protocol/01-statutory-foundation.md §1.3a"

  - id: inf-drafting-artefact
    claim: >-
      Recitals 25 and 97 both speak of MODELS being 'put into service', a limb Article
      2(1), point (a) does not give them and Article 3, point (11) confines to systems.
      Two recitals presupposing a category the definitions withhold is evidence that the
      asymmetry is an artefact of drafting rather than a considered choice.
    type: inference to the best explanation
    function: graded
    premises: [recital-25, recital-97, art2-1a, art3-11]
    depends_on: [inf-asymmetry]
    defeater: >-
      That recitals are drafted loosely as a matter of course, so their vocabulary carries
      no signal about legislative intent. This is a real objection and this analysis has
      not met it. The claim is evidential, not probative, and nothing downstream turns on
      it: inf-relocation and the conclusion stand without it.
    strength: contestable
    load_bearing: false
    stated_at: "docs/report-draft.md §5.1; protocol/01-statutory-foundation.md §1.3a"

  - id: inf-sole-purpose-omission
    claim: >-
      Article 2(6) uses 'for the sole purpose of' in the enacting text and Article 3,
      point (63) does not, so the omission from the definition reads as chosen rather than
      careless, and a reader supplying it from Recital 97 supplies a term the enacting
      text declined.
    type: expressio unius
    function: graded
    premises: [art2-6, art3-63, recital-97]
    depends_on: []
    defeater: >-
      Evidence from the travaux that the qualifier was intended in both places and dropped
      in error. Not consulted; the travaux have not been read for this project.
    strength: moderate
    load_bearing: false
    stated_at: "docs/report-draft.md §5.1 step two"

  - id: inf-product-oriented
    claim: >-
      A frontier developer's cyber-capability evaluation, run on its own account "to
      determine the appropriate safeguards for deployment", is 'product-oriented' research
      within Recital 25 rather than scientific research within Article 2(6), so the
      research provisions postpone rather than exempt - and a postponement only matters
      for a model that is later placed.
    type: characterisation of facts
    function: graded
    premises: [recital-25, art2-6, openai-roadahead-aug26]
    depends_on: []
    defeater: >-
      Evidence that the evaluation was conducted for the sole purpose of scientific
      research and development. An earlier version of this inference rested on "a model
      it intends to ship", with no source premise; the provider's own account, quoted at
      §1 of the report, says the model was "not intended for public release", which is
      why the placement question is now its own inference (inf-placement-event) rather
      than an assumption inside this one.
    strength: moderate
    load_bearing: true
    stated_at: "docs/report-draft.md §5.1"

  - id: inf-placement-event
    claim: >-
      The research model was, or is to be treated as, placed on the market - by
      integration into an own AI system put into service (Recital 97), by being intended
      for placement (the Q&A), or by sharing a large pre-training run with a model that
      was placed (Guidelines para. 22) - so that its development was not activity 'prior
      to' placement.
    type: characterisation of facts
    function: step
    premises: [recital-97, art2-8, art3-63, ec-gpai-guidelines, ec-gpai-qa, openai-roadahead-aug26, metr-redwood-investigation]
    depends_on: []
    defeater: >-
      THE RECORD ALREADY SUPPLIES ONE. The provider says the model was one of several
      "research models that were not intended for public release" and that its weights
      were quarantined after the incident; the investigators call it "a research model
      which was not intended for production". The only system it is recorded as running
      in is the evaluation harness, and testing before putting into service is what
      Article 2(8) excludes. So on the disclosed record this step is not established, and
      one of its three routes is denied. What would establish it: use of the model in any
      own system put into service (Request 4a), or a shared large pre-training run with a
      placed model (Request 2b). Added 13 September 2026 after an external audit found
      the scope verdict stating one open condition where the route needs three.
    strength: contestable
    load_bearing: true
    stated_at: "docs/report-draft.md §5.1 and §7"

  - id: inf-union-nexus
    claim: >-
      Any placement event under inf-placement-event occurred 'in the Union' within
      Article 2(1), point (a) and Article 3, point (11).
    type: characterisation of facts
    function: step
    premises: [art2-1a, art3-11, ec-gpai-guidelines, pistillo-internal-deployment]
    depends_on: [inf-placement-event]
    defeater: >-
      Nothing in the record addresses it, and the provider is established in a third
      country. The Guidelines' internal-use example at para. 51 requires processes
      essential to third-party provision "or that affect the rights of natural persons in
      the Union"; Pistillo records that how 'in the Union' will be read remains unclear.
      Request 4a asks where any own system incorporating the model was put into service.
      This inference is recorded as unestablished rather than as probable.
    strength: contestable
    load_bearing: true
    stated_at: "docs/report-draft.md §5.1 and §7"

  - id: inf-attach
    claim: >-
      On the Commission's reading the Chapter V obligations attach to the internal research
      model, by deemed placement under Recital 97 with the internal-use exception
      unavailable to a model carrying systemic risk.
    type: conclusion of law
    function: step
    premises: [recital-97, art2-1a, art3-10, art3-63, ec-gpai-guidelines, ec-gpai-qa, case-nilsson, case-milch-kontor]
    depends_on: [inf-relocation, inf-product-oriented, inf-placement-event, inf-union-nexus]
    defeater: >-
      A holding that a recital cannot supply a deeming rule the enacting definition
      withholds: Nilsson, C-162/97, para. 54, and in the sharper form Deutsches
      Milch-Kontor, C-136/04, para. 32 - a preamble cannot be relied on "either as a
      ground for derogating from the actual provisions of the act in question or for
      interpreting those provisions in a manner clearly contrary to their wording". The
      second limb is what a challenge would be argued from, AND IT BITES UNEVENLY. Recital
      97 has two limbs: an own system MADE AVAILABLE ON THE MARKET, where the embedded
      model is supplied for use on the Union market in the course of a commercial
      activity and Article 3, points (9) and (10) are arguably just being applied; and an own
      system merely PUT INTO SERVICE, where nothing is supplied to anyone and putting into
      service is the trigger Article 2(1), point (a) withholds from models. A never-released
      model can only use the second limb. The Commission does not rest the second limb on
      the recital alone - Guidelines para. 51 lists essential internal use among its
      examples of placing on the market, read with the Blue Guide - so a challenge is
      really against that reading of 'making available', which is Pistillo's second
      pathway. Whether own use can be a supply is the question, and the enacting text
      does not settle it.
    strength: moderate
    load_bearing: true
    stated_at: "docs/report-draft.md §5.1 and §7"

  - id: inf-opinion-construes
    claim: >-
      Commission Opinion C(2025) 5361 final at paragraph 33, in saying the Code sets out
      'what without undue delay typically requires of reporting timelines', is stating what
      the statutory phrase in Article 55(1), point (c) requires, not merely describing what
      Commitment 9 contains.
    type: reading of a document
    function: graded
    premises: [ec-cop-adequacy-opinion, art55-1c, cop-text]
    depends_on: []
    defeater: >-
      The competing reading, that the paragraph summarises a chapter of the Code rather
      than construing the Act. The sentence sits in a passage framed as compliance
      'pursuant to Article 55(1), point (c)', which favours this reading but does not
      settle it. FLAGGED BY THE AUTHOR AS THE MOST ARGUABLE STEP HERE.
    strength: contestable
    load_bearing: true
    stated_at: "docs/report-draft.md §5.2; protocol/01-statutory-foundation.md §5a"

  - id: inf-cyber-limb
    claim: >-
      A model that escapes containment and reaches a third party's production
      infrastructure falls within Measure 9.3's 'serious cybersecurity breach, including
      the (self-)exfiltration of model weights and cyberattacks' more naturally than within
      the serious-harm-to-property category, so the applicable period is five days.
    type: characterisation of facts
    function: graded
    premises: [cop-text, art3-49]
    depends_on: [inf-opinion-construes, inf-cyber-covered]
    defeater: >-
      The provider's own classification, if it assigned a different category, or its
      taking the guidelines' para. (100) route instead, which reaches the same conduct
      without passing through Measure 9.3's categories at all. Requests 11a and 11b
      of the instrument ask which category was assigned and which route was taken. This is a judgement about facts
      and is deliberately kept out of the verdict cells for that reason.
    strength: moderate
    load_bearing: false
    stated_at: "docs/report-draft.md §5.2; docs/worked-example.md §5"

  - id: inf-irreversibility
    claim: >-
      Limb (b) of Article 3, point (49) fails on these facts because the affected service
      was rebuilt, so the disruption was not irreversible.
    type: application to facts
    function: step
    premises: [art3-49, cer-2-4, hf-technical-timeline]
    depends_on: []
    defeater: >-
      Evidence of a component not restored, or an argument that irreversibility attaches to
      the disruption at the time rather than to its eventual remedy.
    strength: strong
    load_bearing: false
    stated_at: "docs/report-draft.md §5.3; docs/worked-example.md §4"

  - id: inf-bridging-gap
    claim: >-
      'Serious incident' at Article 3, point (49) is defined by reference to an AI system
      while Article 55(1), point (c) binds providers of models, and the Act does not
      expressly bridge the two.
    type: textual
    function: step
    premises: [art3-49, art3-1, art3-66, art55-1c]
    depends_on: []
    defeater: >-
      Any ENACTING provision applying the Article 3, point (49) definition to models. None
      found, and the claim is about the Act. Read it, though, with what has since been
      found outside the Act. The Commission's Article 73 draft guidance says at para. (50)
      that the term "is defined in Article 3(49) AI Act only in relation to AI systems",
      which is this claim in the Commission's own words. And the GPAI Guidelines at para.
      (100) bridge the gap in guidance, treating a model incident that "directly or
      indirectly leads to" an Article 3(49), points (a) to (d) event as a serious incident.
      An earlier version of this defeater said the Code "sidesteps the question", which was
      true of the Code and was not the whole of the record.
    strength: strong
    load_bearing: false
    stated_at: "docs/report-draft.md §5.3; protocol/01-statutory-foundation.md §1.9"

  - id: inf-no-101a-exposure
    claim: >-
      Article 101 applies from 2 August 2026 by operation of Article 113, as does Article
      91 itself; point (b) is therefore available for a request issued now, and the report
      takes no position on whether an omission that began before 2 August 2026 and
      continued past it carries exposure under point (a).
    type: temporal
    function: step
    premises: [art113, art101-1a, art101-1b, art91]
    depends_on: []
    defeater: >-
      For the point (b) half: a transitional provision bringing Article 101 into
      application on a different date; Article 113 was read in the consolidated text and
      its third paragraph in the amending act, and none was found. An earlier version of
      this inference also claimed that July 2026 conduct carries NO point (a) exposure.
      That was asserted beyond the source: a failure to notify under Article 52(1) or to
      report under Article 55(1), point (c) is a continuing omission, and Article 113
      fixes when Article 101 applies, not the temporal reach of fines over omissions that
      persist. Withdrawn 13 September 2026.
    strength: strong
    load_bearing: false
    stated_at: "docs/report-draft.md §5; instrument Part F paragraph 14"

  - id: inf-scaffolding-attribution
    claim: >-
      The conduct in the incident is attributable to the general-purpose AI MODEL and so
      to its provider, rather than to downstream scaffolding - the harness, memory,
      execution loop and tool access - which is where agentic behaviour largely resides
      and which may be another actor's.
    type: attribution
    function: graded
    premises: [art3-1, art3-63, art3-66, art55-1b, art75-1, art75-1a, openai-roadahead-aug26]
    depends_on: [inf-attach]
    defeater: >-
      THE OBJECTION THAT OUTLIVES A SCOPE FINDING, though not the provider's strongest -
      scope and territory defeat everything, where this defeats attribution under Article
      55(1), points (c) and (d) alone and leaves Article 52(1) and Article 55(1), point (b)
      untouched. It attacks attribution rather than definition, so it survives even if
      scope resolves against them. One reply the earlier version of this entry missed:
      Article 3, point (49), Measure 9.3 of the Code and Guidelines para. (100) all reach
      involvement that is the model's "directly or indirectly", which is the language a
      harness objection has to get past.
      Persistent goal-seeking, memory and tool invocation are properties of scaffolding
      rather than of raw weights; if the scaffolding was built by a different actor, the
      conduct may not be the model provider's at all. What blunts it here, and only
      partly, is that the provider's own account describes the evaluation environment as
      its own and names the absent safeguards as its own - "system prompts, harnesses,
      and control mechanisms" - so on these facts the scaffolding appears to be the same
      undertaking's.
      ARTICLE 75(1), POINT (a) BLUNTS IT FURTHER, AND NOT COMPLETELY. The AI Office is
      exclusively competent for the supervision and enforcement of AI systems "based on
      general-purpose AI models where the model and the system are developed by the same
      provider, or by providers forming part of the same undertaking as that provider", and
      Art. 75(1a) routes those systems' serious-incident reports to the AI Office with Art.
      73(2) to (9) applying mutatis mutandis. So the Act already contemplates model plus own
      scaffolding as a regulated unit under one authority, and the "same undertaking" limb
      defeats the corporate-structure version of the objection, where a subsidiary built the
      harness. BE PRECISE ABOUT WHAT THAT DOES: it is a JURISDICTIONAL answer, not an
      ATTRIBUTION one. It shows the objection opens no regulatory gap - the provider cannot
      say "that was the system, not the model" and thereby leave the AI Office's competence.
      It does not show that the scaffolded system's conduct is the model's for Art. 55
      purposes. And where the scaffolding IS a third party's, Art. 75(1), point (a) says so
      by its own terms and the objection keeps its full force.
      That is a fact about this incident, not a general answer, and a
      cross-walk run on a different incident should expect this to be the first thing a
      provider says.
    strength: contestable
    load_bearing: true
    stated_at: "docs/report-draft.md §5.1"

  - id: inf-designation-route
    claim: >-
      The Commission is not dependent on the provider answering the compute question. The
      closing sentence of Article 52(1) lets it designate a model as one with systemic
      risk where it becomes aware of a model presenting systemic risks of which it has not
      been notified, and Article 51(1), point (b) supplies the criteria by reference to
      Annex XIII.
    type: textual
    function: step
    premises: [art51, art52-1, art52-2, art52-3, art90]
    depends_on: []
    defeater: >-
      A reading on which the designation power requires the compute figure first. The
      sentence does not say so: it is triggered by the Commission becoming aware of a
      model PRESENTING systemic risks, and Art. 51(1), point (b) is an alternative to
      point (a) rather than a gloss on it. Art. 52(2) then puts the burden on the provider
      to rebut, which is the opposite of the burden this analysis had assumed throughout.
    strength: strong
    load_bearing: false
    stated_at: "docs/report-draft.md §3"

  - id: inf-annex-xiii-evidence
    claim: >-
      The public record already evidences Annex XIII criterion (e) - the model's level of
      autonomy and scalability and the tools it has access to - in unusual detail, and
      since Annex XIII directs the Commission to "take into account" the criteria rather
      than satisfy all of them, a designation under Article 51(1), point (b) could rest on
      the incident record itself without the training-compute figure.
    type: application to facts
    function: graded
    premises: [annex-xiii, art51, art52-1, metr-redwood-investigation, hf-technical-timeline, collusion-wiki]
    depends_on: [inf-designation-route]
    defeater: >-
      A reading on which "equivalent to those set out in Article 51(1), point (a)" imports
      the compute presumption's magnitude and so requires (c) after all, or a view that
      demonstrated autonomy in one adversarial episode is not a "benchmark or evaluation
      of capabilities" within (e). The second is the more serious: (e) speaks of benchmarks
      and evaluations, and an escape is neither - though it is evidence of what such an
      evaluation would find, and the episode did occur during an evaluation.
    strength: moderate
    load_bearing: false
    stated_at: "docs/report-draft.md §3"

  - id: inf-form-cannot-evidence
    claim: >-
      The Commission's serious-incident template cannot evidence compliance with the Code's
      own reporting periods, because the template states on its face that it demonstrates
      compliance with Article 55(1), point (c) "as part of Commitment 9", every
      INITIAL-REPORT period in Measure 9.3 runs from the date a Signatory becomes aware of
      its model's involvement (the intermediate and final periods run from the initial
      report and from resolution), and the template asks for no date but the incident's
      own start and end. The omission is inherited: fields 1 to 9 transcribe Measure 9.2
      item for item, and Measure 9.2 has no awareness item either.
    type: textual
    function: step
    premises: [ec-incident-template, cop-text, art55-1c]
    depends_on: []
    defeater: >-
      A field, an instruction or accompanying guidance requiring the date of awareness. The
      form was searched in both published renditions, at the level of the DOCX's own stored
      field labels rather than a PDF text layer, and the library page was read; neither
      contains one. The EU SEND submission channel has NOT been seen, and a portal could
      capture a receipt timestamp the form does not - which would answer the date of
      submission but still not the date of awareness.
    strength: strong
    load_bearing: true
    stated_at: "docs/report-draft.md §5.2; docs/appendix-forms.md §3"

  - id: inf-form-statutory
    claim: >-
      The template therefore cannot evidence compliance with the STATUTORY standard either,
      Article 55(1), point (c)'s "without undue delay" being what Measure 9.3 sets out.
    type: conclusion of law
    function: step
    premises: [ec-incident-template, ec-cop-adequacy-opinion, art55-1c, cop-text]
    depends_on: [inf-opinion-construes]
    defeater: >-
      The competing reading of paragraph (33) of the Commission Opinion, on which it
      summarises a chapter of the Code rather than construing the Act. This inference
      inherits that entire risk. It is stated separately from inf-form-cannot-evidence for
      exactly that reason: the recommendation to add two fields follows from the narrower
      claim alone, and a reader who rejects inf-opinion-construes loses this step without
      losing the recommendation.
    strength: moderate
    load_bearing: false
    stated_at: "docs/report-draft.md §5.2"

  - id: inf-cyber-covered
    claim: >-
      A serious cybersecurity breach involving a model with systemic risk falls within the
      Article 55(1), point (c) obligation itself, and not only within the Code, because the
      AI Office says so at paragraph (100) of the GPAI Guidelines and anchors it in Article
      55(1), points (b) and (d).
    type: reading of a document
    function: step
    premises: [ec-gpai-guidelines, art55-1c, art55-1b, art55-1d]
    depends_on: []
    defeater: >-
      That the Guidelines bind nobody and disclaim authority to interpret the Act, which
      their own para. 9 says in terms. What survives that objection is enforcement posture:
      the body that would bring proceedings has published the reading on which it will act.
      A holding that Article 55(1), point (c) is confined to Article 3(49) events would
      defeat it outright, and nothing in the enacting text compels the wider reading.
    strength: strong
    load_bearing: true
    stated_at: "docs/report-draft.md §5.2"

  - id: inf-instrument-selection
    claim: >-
      Which serious-incident regime applies to one undertaking's own model running inside its
      own system is selected by whether the thing pointed at is the model or the system, and
      not by the severity of what happened - so the regime governing models with systemic
      risk carries the thinner instrument, no statutory period, no classification and no
      awareness field, while the system regime carries Article 73's periods and a seven-page
      form.
    type: textual
    function: step
    premises: [art75-1, art75-1a, art55-1c, art73, art3-49, ec-incident-template, ec-art73-draft-guidance]
    depends_on: []
    defeater: >-
      Any provision or guidance making the choice of regime turn on severity, or applying
      Article 73's periods to a model directly. None found. The nearest thing running the
      other way is that Article 75(1a) only reaches providers of HIGH-RISK AI systems, so on
      facts where the own-system is not high-risk the regimes do not both apply at all - which
      does not defeat the claim, it is the claim: a non-high-risk system carrying a
      systemic-risk model is reported under the lighter regime alone. What WOULD defeat it is
      a final Article 73 guidance extending to Article 55(1), point (c), or a general-purpose
      template revised to carry the structural fields; the draft guidance at para. (4)
      excludes general-purpose models by name, and the template was published in that state.
      TWO LIMITS THE FIRST VERSION OF THIS ENTRY DID NOT STATE. This is a claim about
      structure, and as structure it needs nothing from the scope inferences; applied to
      THIS incident it needs inf-attach (the model must be one with systemic risk for the
      Article 55(1), point (c) regime to be the applicable one) and
      inf-scaffolding-attribution (the system must be the same undertaking's). And it is
      prospective: Article 73 has applied only since 2 August 2026, Article 75(1a) since
      27 July 2026, the high-risk classification both depend on is deferred to 2 December
      2027 and 2 August 2028, and the seven-page form is a consultation draft. The
      comparison is between two drafting choices, not two live regimes. Also: the
      general-purpose template's omission is not the Commission's drafting choice but the
      Code's - fields 1 to 9 transcribe Measure 9.2 item for item - so the report no longer
      calls the bifurcation the omission's "cause".
    strength: strong
    load_bearing: true
    stated_at: "docs/report-draft.md §5.2"
