      Not public. The provider's account says its monitoring alerted it on 19 July and it
      connected the activity to the affected party on 20 July; whether either is the date
      of awareness of its model's involvement for Measure 9.3, or an earlier date is, the
      record does not say. Request 11a of the instrument asks it.
    rows: [g2-art55-1c-timing]
    sources: [openai-roadahead-aug26]

  - field: "1b"
    label: "Date of submission of this report"
    status: cannot-fill
