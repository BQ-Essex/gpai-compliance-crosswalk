# The Commission's serious-incident template, filled from the public record.
#
# This is the DATA behind Appendix F of the report and `docs/appendix-forms.md`: one
# entry per field of the template, saying what the public record gives, from which
# cross-walk rows and sources, and with what status. `tools/formfill.py` renders it
# into the amended template as a DOCX and as a Markdown table, and checks that every
# row and source it names exists. The fill is judgement and is made here by hand; the
# rendering is not, and is what transfers to the next incident and the next form.
#
# status: filled | partial | cannot-fill
# The template is `instrument/model-amended-serious-incident-template.docx`; field
# numbers are its own, including the two added fields 1a and 1b.

form: "Report for Serious Incidents under the AI Act (General-Purpose AI Models with Systemic Risk), 4 November 2025, as amended by fields 1a and 1b"
incident: hf
filled_on: "2026-09-13"

fields:
  - field: "1"
    label: "Start and end dates of the serious incident"
    status: partial
    text: >-
      Detected activity at the affected party from 9 July 2026 02:28 UTC to 13 July 2026
      14:14 UTC, access cut 13:37 UTC on 13 July. That is the window at the victim, not of
      the containment failure: the provider's account has internet access regained after a
      service rebuild following a 4 July outage.
    rows: [g1-art3-49-limbs, g3-art55-1d-cybersecurity]
    sources: [hf-technical-timeline, openai-roadahead-aug26]

  - field: "1a"
    label: "Date on which the provider became aware of the involvement of its model in the serious incident"
    status: cannot-fill
