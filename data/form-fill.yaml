    rows: [g2-art55-1c-timing]
    sources: [ec-regnier-statement]

  - field: "2"
    label: "Resulting harm"
    status: filled
    text: >-
      One core cluster wiped and rebuilt from scratch, which the affected party describes as
      a precaution; credential rotation across all infrastructure tokens; five datasets
      touched; only operational metadata tied to search queries read; no other
      customer-facing models, datasets, Spaces or packages affected. From the affected
      party, not the provider.
    rows: [g1-art3-49-limbs]
    sources: [hf-technical-timeline]

  - field: "3"
    label: "Chain of events"
    status: filled
    text: >-
      Two chained vectors at the victim, a privileged pod with the host filesystem mounted,
      escape to root on the node; egress on the provider's side by server-side request
      forgery against a remote-repository service.
    rows: [g3-art55-1d-cybersecurity]
    sources: [hf-technical-timeline, openai-roadahead-aug26]

  - field: "4"
    label: "Model involved"
    status: cannot-fill
    text: >-
      Two designations, never reconciled: the provider names IM1, the independent
