    establishes:
      - >-
        THE THREE-CONDITION TEST, verbatim: “a general-purpose AI model is also considered
        to be placed on the market if that model's provider integrates the model into its
        own AI system which is made available on the market or put into service, unless the
        model is (a) used for purely internal processes that are not essential for providing
        a product or a service to third parties, (b) the rights of natural persons are not
        affected, and (c) the model is not a general-purpose AI model with systemic risk
        (recital 97 AI Act).” It attributes the test to Recital 97 and to no enacting
        provision, and cross-refers to section 3 of the Guidelines.
      - >-
        IT ANSWERS THE ARTICLE 2(8) OBJECTION DIRECTLY, under the heading “Do the
        obligations for providers of general-purpose AI models apply in the development
        phase?”: Article 2[(8)] applies “as a general matter”, but “certain obligations for
        providers of general-purpose AI models (with and without systemic risk) explicitly
        or implicitly pertain to the development phase of models intended for, but prior
        to, the placing on the market” - naming notification under Articles 51 and 52,
        documentation under Article 53, and assessment and mitigation of systemic risk
        under Article 55, and quoting Article 55(1), point (b) in terms.
      - "Notification duty applies where the model 'meets or will meet' the training compute threshold laid down in Article 51(2)"
    caveats:
      - >-
        Self-disclaims, in the opening words of the page: “With this Q&A, the AI Office
        seeks to facilitate the interpretation of certain provisions of the AI Act. This
        Q&A does not constitute an official position of the Commission, and it is without
        prejudice to any decision or position of the Commission. Only the Court of Justice
        of the European Union is competent to authoritatively interpret the AI Act.”
      - >-
        Note what that means for the finding. The clearest statement that Chapter V reaches
        the development phase, and the only consolidated statement of the three-condition
        test, both sit in a document that disclaims being the Commission's position at all.

