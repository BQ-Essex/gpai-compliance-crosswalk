  - id: collusion-wiki
    tier: T4
    date: "2026-09-04"
    title: "DseWiki incident analysis"
    author: "Von Arx, S., Byrd, C.S., Kitts, S. and Larsen, T."
    url: "https://collusion.wiki/#timeline"
    archived_url: "https://web.archive.org/web/20260912133451/https://collusion.wiki/"
    archived: "2026-09-12"
    earliest_capture: "https://web.archive.org/web/20260904112052/https://collusion.wiki/"
    date_note: >-
      THE SOURCE'S OWN DATE MOVED, which is why this entry cites a capture rather than a
      page. In the earliest capture, 4 September 2026 at 11:20:52Z, the byline reads
      'Sydney Von Arx, Cormac Slade Byrd, Spencer Kitts, Thomas Larsen - 3 September
      2026'. In the capture of 12 September at 13:34:51Z it reads 4 September and has
      gained affiliation notes, 'Nightingale Collective' against the first author and
      'Work done contracting for Nightingale' against the third. This register formerly
      recorded one author and an affiliation that the page did not carry when it was
      first captured. Both are corrected above.
    archive_note: >-
      OPEN ITEM NOW CLOSED, and closed the right way round. The figures in the establishes
      list had been read from the live site, which has sixteen distinct versions in eight
      days. They have since been checked against both captures named here and are
      identical in each, in context and not merely by pattern: the ~18,000 total, the
      ~17,000 on DSEWiki, the 98.5% Azure share, the 197 edits traced to AWS, DigitalOcean
      and Tor, the 3,700+ agent names, and the 29 attempted edits of 1-2 July. The page
      grew between the two captures, gaining sections on a package-registry attack and
      further findings; the numbers this analysis relies on did not move.
    denominator_note: >-
      The two percentages have different bases and the source keeps them apart: 98.5% is
      of the ~17,000 DSEWiki edits, while the 197 is of the ~18,000 total across all
      wikis. An earlier draft of the worked example listed them in one series, which
      invited a reader to take both against the same base.
    additional_urls:
      - "https://collusion.wiki/#key-facts"
      - "https://collusion.wiki/explorer/"          # agent activity by day, edits, names
      - "https://collusion.wiki/additional-findings"
    establishes:
      - "First attempted agent edits 2026-05-11 (publictestwiki.com, not DSEWiki)"
      - "First successful DSEWiki edit 2026-05-24 05:13Z"
      - "Last coordinated agent activity 2026-06-22"
      - "Final burst 2026-07-01/02: 29 attempted edits across three wikis"
      - "~18,000 agent posts total; ~17,000 on DSEWiki"
      - "98.5% from Microsoft Azure IP ranges; 197 edits via AWS, DigitalOcean, Tor"
      - "3,700+ distinct self-identified agent names"
      - "First OpenAI-attributed IP visit 2026-06-21"
      - "2026-06-26: 30% of all OpenAI-attributed visits, across 33 distinct IPs"
      - "2026-07-02: employee IP visits pages edited by agents six hours after those edits"
      - "2026-07-07: employee IP attempts to access deleted files"
      - "Behaviours: answer-sharing; reverse-engineering random seeds to predict questions; POST-restriction circumvention via Azure blob storage hostname spoofing; heartbeat timers to detect container termination; SSH tunnels; moderator impersonation; ZZZ-prefixed backup pages to survive alphabetical deletion sweeps"
    caveats:
      - "Researchers' own stated limits: 'We can only see what the agents wrote on the wiki'; no chain-of-thought access"
      - "Uncertain whether tasks were training or testing"
      - "Unexplained: Tor use, XSS attempts, agent name discrepancies"
    tier_note: >-
      Independent of the provider and derived from publicly inspectable logs.
      This is why the knowledge-date evidence is stronger here than anything
      resting on the provider's own account.

  - id: ec-regnier-statement
    tier: T4
    date: "2026-09-07"
    title: "European Commission statement on the DseWiki filing (spokesperson Thomas Regnier)"
    url: "https://www.ibtimes.co.uk/openai-eu-scrutiny-dsewiki-incident-1818384"
    establishes:
      - "Commission received a report from OpenAI concerning DseWiki and 'remained in close contact'"
      - "Regnier DECLINED to disclose the filing date"
      - "Regnier DECLINED to disclose the report's contents"
      - "Regnier DECLINED to confirm whether DseWiki qualifies as a 'serious incident'"
      - "Regnier: 'it was not the first time control over AI agents had been lost'"
    corroboration:
      - >-
        Two further outlets report the same declinations independently on 7-8 September
        2026, and one adds a fourth: that Regnier declined to say WHICH LEGAL PROVISION
        OpenAI relied on, and whether any enforcement action would follow. See
        https://thenextweb.com/news/openai-eu-incident-report-german-wiki and
        https://www.techtimes.com/articles/326933/20260908/openai-files-first-eu-ai-act-incident-report-chief-scientist-admits-monitoring-gap.htm
        (both retrieved 12 September 2026, neither held as a file).
      - >-
        One of those outlets characterises the filing as arriving "approximately 75 days"
        after agents were detected on 21 June 2026. That is a secondary source's
        ARITHMETIC, not a date the Commission or the provider has stated, and it is
        recorded here as characterisation rather than fact.
    documented_negatives:
      - The Commission has NOT said the episode meets the Article 3(49) definition.
      - >-
        THIS IS BETTER THAN AN ABSENCE AND SHOULD BE USED AS SUCH. The regulator was
        asked, on the record, and declined: the date, the contents, the provision relied
        on, and whether the episode qualifies. A negative-search note that says "no
        published source states X" is weaker than a source establishing that the body
        which knows X was asked and would not say.

