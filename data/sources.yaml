  - id: cop-text
    tier: T4
    date: "2025-07"
    retrieved: "2026-09-12"
    title: "Code of Practice for General-Purpose AI Models — Safety and Security Chapter"
    url: "https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai"
    document_url: "https://ec.europa.eu/newsroom/dae/redirection/document/118119"
    document: "Code_of_Practice_for_GeneralPurpose_AI_Models_Safety_and_Security_Chapter_118119.pdf"
    sha256: "d879f9b54c6068aae57ebaead9d90ddaa46f2503312b9185367a724fa8da2f4a"
    establishes:
      - >-
        COMMITMENT 9, SERIOUS INCIDENT REPORTING, states its own legal basis as “Article
        55(1), and recitals 114 and 115 AI Act”, and commits Signatories to keeping track
        of, documenting and reporting relevant information “without undue delay ... along
        the entire model lifecycle”.
      - >-
        MEASURE 9.3 SUPPLIES THE PERIODS ARTICLE 55(1), POINT (c) DOES NOT, running from
        the date the Signatory “become[s] aware of the involvement of their model”: two
        days for a serious and irreversible disruption of the management or operation of
        critical infrastructure; FIVE DAYS for “a serious cybersecurity breach, including
        the (self-)exfiltration of model weights and cyberattacks”; 10 days for a death;
        15 days for serious harm to health, an infringement of Union-law fundamental-rights
        obligations, or serious harm to property or the environment.
      - >-
        THE TRIGGER THRESHOLD IS LOW. Each period runs where the Signatory establishes “or
        suspect[s] with reasonable likelihood” the causal relationship between the model
        and the event.
      - >-
        Intermediate reports at least every four weeks while an incident is unresolved; a
        final report within 60 days of resolution; documentation retained at least five
        years (Measures 9.3 and 9.4).
      - >-
        Measure 9.2 lists nine items the initial report must cover, including the chain of
        events that “(directly or indirectly)” led to the incident, the model involved, and
        a root cause analysis naming “any failures or circumventions of systemic risk
        mitigations”.
      - >-
        RECITAL (a), PRINCIPLE OF APPROPRIATE LIFECYCLE MANAGEMENT: Signatories recognise
        that providers “should continuously assess and mitigate systemic risks, taking
        appropriate measures along the entire model lifecycle (INCLUDING DURING DEVELOPMENT
        THAT OCCURS BEFORE AND AFTER A MODEL HAS BEEN PLACED ON THE MARKET)”.
    documented_negatives:
      - >-
        As of 12 September 2026, in the chapter as held: it contains no definition of
        'serious incident' and does not cite Article 3, point (49) anywhere. The Measure
        9.3 categories are stated in their own terms, and the second of them - a serious
        cybersecurity breach including (self-)exfiltration of model weights and
        cyberattacks - has no counterpart among the four limbs of Article 3, point (49).
    tier_note: >-
      A voluntary instrument drawn up by independent experts in a multi-stakeholder process,
      not Union legislation. Its significance here is not that it binds but that a Signatory
      has adopted it: Article 55(2) makes adherence a way of demonstrating compliance, and
      Article 56(6) as amended obliges the Commission to assess whether the codes cover the
      Article 53 and 55 obligations and to publish that assessment.

  - id: ec-art73-draft-guidance
    tier: T4
    date: "2025-09-26"
    retrieved: "2026-09-12"
    title: "AI Act: Commission issues draft guidance and reporting template on serious AI incidents, and seeks stakeholders' feedback"
    url: "https://digital-strategy.ec.europa.eu/en/consultations/ai-act-commission-issues-draft-guidance-and-reporting-template-serious-ai-incidents-and-seeks"
    document_urls:
      - "https://ec.europa.eu/newsroom/dae/redirection/document/119624"
      - "https://ec.europa.eu/newsroom/dae/redirection/document/119623"
    establishes:
      - >-
        A SEPARATE regime and a SEPARATE form. “Draft Guidance article 73 AI Act -
        incident reporting” and “Incident report for serious incidents under the AI Act
        (High-risk AI systems)” are distinct documents from the GPAI template at
        ec-incident-template. The Commission maintains two serious-incident forms: one for
        models, one for systems.
      - >-
        The page states the draft guidance “clarifies definitions, offers practical
        examples, and explains how the new rules relate to other legal obligations”, and
        that the approach “seeks alignment with international initiatives, such as the
        OECD's AI Incidents Monitor and Common Reporting Framework”. Those are the PAGE's
        words and the page is not held as a file. The document itself puts it differently
        at para. (3) - “The AI Act incident monitoring seeks to align with the OECD
        framework wherever possible” - so the page paraphrases rather than quotes, and
        the two should not be run together.
    documented_negatives:
      - >-
        As of 12 September 2026 the page is dated last-updated 4 November 2025, still
        offers both documents as DRAFT, and links no final version. The consultation
        closed 7 November 2025, ten months earlier. A plausible reading is that the
        Omnibus deferred the high-risk obligations these documents serve - to 2 December
        2027 and 2 August 2028 - and took the urgency with it.
        BOUNDED: this is the absence of a final version FROM THIS PAGE. The site's own
        search endpoint is unusable for a recency sweep - a query for “serious incident
        reporting” returned events from 2020 - so a final version published elsewhere
        would not necessarily have been found.
    documents:
      - file: "Draft_Guidance_article_73_AI_Act__incident_reporting_119624.pdf"
        sha256: "f1d58ecf69004b361d2201ea44e6219f00c27ba249ad5011965152de9167686d"
        pages: 13
      - file: "Incident_report_for_serious_incidents_under_the_AI_Act_Highrisk_AI_systems_119623.pdf"
        sha256: "20f90c54a7cd0fb952d08965947dabfa6e423515cab925d9c4b9c81364ed5a82"
        pages: 7
        version_marker: "Reporting Template Version: 1.0.0 (SB-10407)"
    establishes_from_the_documents_themselves:
      - >-
        THE HIGH-RISK FORM ASKS FOR EVERY DATE THE GPAI FORM OMITS. Section 1.2 of the
        high-risk template, “Date, type, and classification of incident report”, has four
        date fields: (a) “Date of report submission”, (b) “Date of incident” with a range,
        (c) “Date and time of detection of the incident”, and (d) “Manufacturer awareness
        date of reportability”, each “in format YYYY-MM-DD”. The two fields this analysis
        recommends adding to the GPAI form are therefore not a proposal: the Commission has
        already drafted them for the other regime. NOTE THE DIFFERENCE rather than
        glossing it - (d) asks for awareness of REPORTABILITY, which tracks Art. 73(2)'s
        “has established a causal link between the AI system and the serious incident or
        the reasonable likelihood of such a link”,
        whereas Measure 9.3 runs from awareness of the model's INVOLVEMENT.
      - >-
        Field 1.2(e) makes the report a cycle: Initial / Follow up / Combined initial and
        final / Final (Reportable incident) / Final (Non-reportable incident), with 1.2(f)
        asking the expected date of the next report. The GPAI form has no report-type field
        at all, so an initial report and a final one are indistinguishable on their face.
      - >-
        Field 1.2(g) classifies the incident by tick-box: Death; Harm to a person's health;
        Disruption of the management of critical infrastructure; Disruption of the operation
        of critical infrastructure; Infringement of obligations under Union law intended to
        protect fundamental rights; Harm to property; Harm to environment; All other
        reportable incidents. That is Art. 3(49), points (a) to (d), unpacked by the
        Commission itself - and there is NO CYBERSECURITY CATEGORY, which independently
        confirms this analysis's reading that Measure 9.3's cyber trigger has no counterpart
        in the Act's own definition.
      - >-
        Section 1.3.5, “Information about other incident obligations”, asks whether the
        incident “was already reported to” another authority and “Under Regulation/Law”.
        The GPAI form has no cross-regime field, though a serious incident involving a model
        with systemic risk is the one most likely to be reportable in several jurisdictions
        at once.
      - >-
        Section 4.2 asks the provider for a root-cause conclusion, for a “rationale for why
        this is considered not reportable” where the report is final and non-reportable, and
        whether “the risk assessment been reviewed” and whether it “is still adequate”. The
        GPAI form asks for none of these. The regime governing models the Act treats as
        capable of Union-level harm carries the LIGHTER reporting instrument: seven pages
        against two, five sections against ten free-text boxes.
      - >-
        Section 5 carries a disclaimer that submission “does not represent a conclusion by
        the provider ... that the AI system(s) listed failed in any manner”, and an
        affirmation that the information “is correct to the best of my knowledge”, over a
        date. The GPAI form carries neither disclaimer nor affirmation.
      - >-
        Field 1.2(d) says “Manufacturer”, a term the AI Act does not use for this actor;
        the form says “provider” ten times elsewhere and “manufacturer” once. The guidance's
        own footnote 4 cites Art. 2(64) of Regulation (EU) 2017/745, the Medical Device
        Regulation, when defining 'incident', so the vigilance-reporting lineage is stated
        rather than inferred.
      - >-
        GUIDANCE PARA. (4): “The reporting obligation of Article 73 AI Act applies to
        serious incidents and widespread infringements of high-risk AI systems. Article
        55 (1)(c) AI Act also lays down an obligation for providers of general-purpose AI
        models with systemic risk to report serious incidents to the AI Office. This
        guidance is not dealing with the obligation to report such serious incidents of
        general-purpose AI models with systemic risk.” The separation of the two regimes is
        the Commission's express choice, not an accident of drafting.
      - >-
        GUIDANCE PARA. (50), AND THIS IS THE COMMISSION STATING THIS ANALYSIS'S BRIDGING
        GAP IN TERMS: “The term 'serious incident' is defined in Article 3(49) AI Act only
        in relation to AI systems. For serious incidents concerning general-purpose AI
        models with systemic risk pursuant to Article 55(1)(c) AI Act, the General-Purpose
        AI Code of Practice facilitates demonstrating compliance by way of its Commitment 9
        in the Safety and Security Chapter.” The bridge the Commission names is the CODE,
        not the Act.
      - >-
        GUIDANCE PARA. (3): “The AI Act incident monitoring seeks to align with the OECD
        framework wherever possible”, naming the OECD AI Incidents Monitor and Common
        Reporting Framework.
      - >-
        GUIDANCE PARA. (57) reads Art. 73(9) as meaning that for Annex III point 2 systems
        also subject to the CER Directive, “the obligation to report incidents for AI
        systems mentioned in Annex III point 2 AI Act only applies to the violation of
        fundamental rights”, and para. (60) does the same for NIS2, whose Art. 23(4)
        timelines it describes as an early warning within 24 hours of becoming aware, a
        notification within 72 hours of becoming aware, and a final report within one month.
    tier_note: >-
      Both documents read 12 September 2026, in the DRAFT versions the consultation page
      still serves. They are draft, and the guidance says so on its face; nothing here
      treats them as settled law. What they evidence is what the Commission asks for when
      it drafts a serious-incident form with the time to do it properly.

  - id: us-ca-sb53
    tier: T4
    date: "2025-09-29"
    retrieved: "2026-09-13"
    title: "Transparency in Frontier Artificial Intelligence Act, California SB 53 (2025-2026 Regular Session), Business and Professions Code, Division 8, Chapter 25.1"
    url: "https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SB53"
    reproduction_read: "https://law.justia.com/codes/california/code-bpc/division-8/chapter-25-1/"
    provenance: reproduction
    provenance_note: >-
      NOT VERIFIED AGAINST THE OFFICIAL TEXT. The California Legislative Information site
      disallows automated retrieval by robots.txt, so the subdivisions below were read on
      13 September 2026 in a published reproduction of the codified chapter and not in the
      enacted text. This is the same provenance class the CER extracts spent a day in, and
      it is recorded rather than glossed for the same reason: two entries in the corrections
      log came from trusting a reproduction. WHAT WOULD SETTLE IT: the chapter as published
      by the California Legislative Information site, read by hand.
    establishes:
      - >-
        Sec. 22757.11(c)(1): "Catastrophic risk" requires a foreseeable and material risk of
        "the death of, or serious injury to, more than 50 people or more than one billion
        dollars ($1,000,000,000) in damage to, or loss of, property arising from a single
        incident", with limb (B) "Engaging in conduct with no meaningful human oversight,
        intervention, or supervision that is either a cyberattack or, if the conduct had been
        committed by a human, would constitute the crime of murder, assault, extortion, or
        theft" and limb (C) "Evading the control of its frontier developer or user."
      - >-
        Sec. 22757.11(d)(1), AND THE QUALIFIER MATTERS: a critical safety incident includes
        "Unauthorized access to, modification of, or exfiltration of, the model weights of a
        frontier model THAT RESULTS IN DEATH OR BODILY INJURY". The weights limb is not
        free-standing. On the facts of this incident it would not be engaged.
      - >-
        Sec. 22757.11(d)(4): a further limb for "A frontier model that uses deceptive
        techniques against the frontier developer to subvert the controls or monitoring of
        its frontier developer OUTSIDE OF THE CONTEXT OF AN EVALUATION DESIGNED TO ELICIT
        THIS BEHAVIOR and in a manner that demonstrates materially increased catastrophic
        risk." The July 2026 episode originated inside an evaluation.
      - >-
        Sec. 22757.11(i)(1): "Frontier model" means a foundation model trained using "a
        quantity of computing power greater than 10^26 integer or floating-point operations",
        and (i)(2) includes fine-tuning and other material modifications in that quantity -
        which the EU threshold at Art. 51(2) does not spell out.
      - >-
        Sec. 22757.11(j): "Large frontier developer" means one whose affiliates collectively
        had "annual gross revenues in excess of five hundred million dollars".
      - >-
        Sec. 22757.13(c)(1): a frontier developer "shall report any critical safety incident
        ... within 15 days of DISCOVERING the critical safety incident", and (c)(2) adds a
        24-HOUR tier where the incident "poses an imminent risk of death or serious physical
        injury" - a tier this analysis had not recorded.
      - >-
        Sec. 22757.13(a)(4), WHICH BEARS DIRECTLY ON THIS REPORT'S SCOPE QUESTION: the
        reporting mechanism must capture "Whether the incident was associated with INTERNAL
        USE of a frontier model". California's form has a field for the thing the EU analysis
        spends its first section establishing; the EU's has none.
      - >-
        Sec. 22757.13(a) lists what the mechanism must capture: the DATE OF THE INCIDENT, the
        reasons it qualifies, a short and plain statement, and the internal-use flag. It does
        NOT list a date of discovery, though (c)(1) runs the clock from discovery. The gap
        this report finds in the Commission's template is therefore not peculiar to the EU,
        which is worth saying because it makes the finding a pattern rather than a complaint
        about one form.

