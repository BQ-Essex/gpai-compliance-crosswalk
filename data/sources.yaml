  - id: ec-incident-template
    tier: T4
    date: "2025-11-04"
    retrieved: "2026-09-12"
    title: "AI Act: Commission publishes a reporting template for serious incidents involving general-purpose AI models with systemic risk"
    url: "https://digital-strategy.ec.europa.eu/en/library/ai-act-commission-publishes-reporting-template-serious-incidents-involving-general-purpose-ai"
    document_urls:
      - "https://ec.europa.eu/newsroom/dae/redirection/document/121270   # listed first, labelled DOCX"
      - "https://ec.europa.eu/newsroom/dae/redirection/document/121268   # listed second, labelled PDF"
    establishes:
      - >-
        An official template exists: “Report for Serious Incidents under the AI Act
        (General-Purpose AI Models with Systemic Risk)”, published 4 November 2025.
      - >-
        The landing page states the template “promotes consistent and transparent
        reporting and helps providers demonstrate compliance with the commitments set out
        in Commitment 9 of the GPAI Code of Practice”, which is the Commission tying the
        Art. 55(1)(c) obligation to Commitment 9 in terms.
      - >-
        It records that for HIGH-RISK AI SYSTEMS the Commission had already published
        draft guidance and a separate reporting template, open for feedback to
        7 November 2025 - a different instrument for a different regime.
    document: "Report_for_Serious_Incidents_under_the_AI_Act_GeneralPurpose_AI_Models_with_Systemic_Risk_121268.pdf"
    sha256: "ac0004e887783bd1b743c429e9ce64684478afb527a20fcb57e0ac680f6730f4"
    second_rendition:
      document: "Report_for_Serious_Incidents_under_the_AI_Act_GeneralPurpose_AI_Models_with_Systemic_Risk_121270.docx"
      sha256: "ccf778dd3da3da4ea67e047d9a4382ef6acfc8f384a66ce31b98b37d83414b5a"
      note: >-
        Read 12 September 2026 by unpacking the OOXML and extracting every w:t run from
        word/document.xml and word/glossary/document.xml - that is, the field labels and
        placeholder prompts as the file stores them, not as a PDF text layer renders them.
        The two renditions carry identical headings and identical placeholder text. They
        differ only in the reading order of the number column and in pagination. The
        glossary part, which holds the content-control placeholders, introduces no field
        that the body does not show.
    establishes_from_the_template_itself:
      - >-
        Its opening line: the template “serves as a means to demonstrate compliance with
        Article 55(1), point (c), of the AI Act as part of Commitment 9 of the Safety and
        Security Chapter of the General-Purpose AI Code of Practice.”
      - >-
        Ten numbered fields over two pages. Fields 1-9 track Measure 9.2 closely. Field 10,
        “Submitter information”, has no counterpart in Measure 9.2: provider / authorised
        representative / other, organisation, contact name, email and phone.
      - >-
        Field 5 asks for the “evidence available” setting out the model's involvement
        where Measure 9.2 asks for the “material available”. Evidence is the stronger word.
      - >-
        The entire template is 1,884 characters of text: a title, one framing sentence,
        ten field headings, ten placeholder prompts and six contact sub-fields. That is
        the whole of what the Commission asks a provider to say about a serious incident
        involving a model with systemic risk.
      - >-
        Field 1's prompt admits approximation on its face: the start and end dates “or
        best approximations thereof if the precise dates are unclear.” The only date the
        form asks for is the one it allows you to estimate.
      - >-
        Fields 6 and 7 both open “What, if anything” - the response and the recommendation
        are optional in substance, not merely in completion.
      - >-
        Field 10 is the only field broken into labelled sub-fields, a to f. Everything a
        regulator would have to compute from - dates, chain of events, root cause,
        monitoring - is a single unstructured free-text control. The form is granular
        about who is filing and unstructured about everything else.
    documented_negatives:
      - >-
        THE FORM NEVER ASKS WHEN THE PROVIDER BECAME AWARE. The words “aware”,
        “awareness”, “deadline” and “timeline” do not occur in the template at all, and
        the only dates it requests are the start and end of the incident (field 1). There
        is no field for the date of submission either. Every initial-report period in Measure
        9.3 runs from the date the signatory becomes aware of its model's involvement (the
        intermediate and final periods run from the initial report and from resolution),
        fields 1 to 9 transcribe Measure 9.2, which has no awareness item, and the
        Commission Opinion at para. 33 describes Measure 9.3 as setting out what “without
        undue delay” typically requires. So the official form for demonstrating compliance
        with Art. 55(1)(c) contains no field from which compliance with its own timeliness
        standard could be computed. See docs/appendix-forms.md section 3.
        BOUNDED, and the bound is unusually tight for a negative search. The corpus is the
        complete text of BOTH published renditions of the form: the PDF's text layer
        (document 121268) and every w:t run in the DOCX's word/document.xml and
        word/glossary/document.xml (document 121270). The searched terms were “aware”,
        “awareness”, “deadline”, “timeline”, “undue delay”, “submission” and “days”; all
        return zero in both. “date” returns two hits, both inside field 1. Because the
        DOCX search runs against the field labels and placeholders as the file stores
        them, the absence is a property of the form itself and not of a PDF extraction.
        What this does not bound: instructions carried outside the form - on the library
        page, in the EU SEND channel, or in correspondence - have not been searched for a
        date-of-awareness requirement, and the landing page does not state one.

  - id: ec-cop-adequacy-opinion
    tier: T4
    date: "2025-08-01"
    retrieved: "2026-09-12"
    title: "Commission Opinion on the assessment of the General-Purpose AI Code of Practice within the meaning of Article 56 of Regulation (EU) 2024/1689"
    reference: "C(2025) 5361 final, Brussels, 1.8.2025"
    url: "https://digital-strategy.ec.europa.eu/en/library/commission-opinion-assessment-general-purpose-ai-code-practice"
    document_url: "https://ec.europa.eu/newsroom/dae/redirection/document/118688"
    sha256: "60ef852b4bd23c7e269426f4e5254896df9a46c9945d8070934fb9efc557c94c"
    establishes:
      - >-
        PARA. 57, THE CONCLUSION: “the Commission concludes that the General-Purpose AI
        Code of Practice adequately covers the obligations provided for in Articles 53 and
        55 of the AI Act and meets the aims according to Article 56 of the AI Act.”
      - >-
        PARA. 38: “the Safety and Security Chapter of the Code adequately covers the
        obligations provided for in Article 55(1), and the parts thereof outlined in
        Article 56(2), points (c) and (d), of the AI Act, for providers of general-purpose
        AI models with systemic risk.”
      - >-
        PARA. 33, THE MOST IMPORTANT SENTENCE IN THIS REGISTER FOR THE TIMING QUESTION:
        Commitment 9 “specifies how providers of general-purpose AI models with systemic
        risk may keep track of, document, and report relevant information about serious
        incidents ... pursuant to Article 55(1), point (c), of the AI Act. In particular,
        it sets out ... WHAT 'WITHOUT UNDUE DELAY' TYPICALLY REQUIRES OF REPORTING
        TIMELINES (MEASURE 9.3)”. The Commission is stating what the statutory phrase
        typically requires, and pointing at the two/five/ten/fifteen-day scheme.
      - >-
        Para. 28: the Transparency and Copyright Chapters adequately cover Art. 53(1) and
        the parts outlined in Art. 56(2), points (a) and (b); the Safety and Security
        Chapter adequately covers the transparency obligations specific to systemic-risk
        model providers under Annex XI, Section 2.
      - >-
        Para. 35: the Art. 55(1) obligations “are not isolated but complement and feed into
        each other” - model evaluations under (a) and serious incident reporting under (c)
        are “an essential part of” systemic risk assessment under (b), and cybersecurity
        under (d) limits the scenarios that could lead to incidents.
    tier_note: >-
      A published Commission act, C(2025) 5361 final, not a web page and not guidance that
      disclaims itself. It is the firmest support in this register for the proposition that
      the Code's timelines are how Art. 55(1)(c) is complied with.

