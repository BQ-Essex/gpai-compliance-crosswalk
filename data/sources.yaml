  - id: openai-roadahead-aug26
    tier: T1
    date: "2026-08-26"
    title: "The Hugging Face incident and the road ahead"
    url: "https://openai.com/index/hugging-face-incident-and-the-road-ahead/"
    archived_url: "https://web.archive.org/web/20260827003206/https://openai.com/index/hugging-face-incident-and-the-road-ahead/"
    archived: "2026-08-27"
    archive_note: >-
      Cite the capture, not the live page. The Wayback Machine holds 42 captures of this
      URL between 26 August and 10 September 2026 and 37 distinct content digests, which
      looks at first like a heavily revised account and is not. The body text of the
      captures at 2026-08-27 00:32:06Z and 2026-08-31 21:22:34Z is word-for-word
      identical; the capture at 2026-09-10 13:34:01Z differs only in site furniture, its
      navigation gaining a model name and its topic tags gaining one entry. The digests
      change because the page's boilerplate does. Recorded because a digest count is the
      obvious thing to reach for when arguing a source has moved, and here it would have
      been wrong.
    establishes:
      - "IM1 named as internal-only research model; 'IM1 agents drove the principal compromise'"
      - "GPT-5.6 Sol agents 'also reproduced an exploit'"
      - "'we did not enable the same level of safeguards as our externally deployed systems'"
      - "Absent safeguards: system prompts, harnesses, auto-review models, safety classifiers"
      - "Egress via server-side request forgery against Artifactory's remote-repository service"
      - "Internet access REGAINED after Artifactory rebuild following the 4 July outage"
      - "'warning shot' framing; loss-of-control language"
      - "Corrective measures described publicly"
    documented_negatives:
      - "Contains NO mention of notification to any regulatory authority."

  - id: openai-wiki-ack-sep5
