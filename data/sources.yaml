  - id: cop-text
    tier: T4
    date: "2025-07"
    retrieved: "2026-09-12"
    title: "Code of Practice for General-Purpose AI Models — Safety and Security Chapter"
    url: "https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai"
    document_url: "https://ec.europa.eu/newsroom/dae/redirection/document/118119"
    document: "Code_of_Practice_for_GeneralPurpose_AI_Models_Safety_and_Security_Chapter_118119.pdf"
    sha256: "d879f9b54c6068aae57ebaead9d90ddaa46f2503312b9185367a724fa8da2f4a"
    establishes:
      - >-
        COMMITMENT 9, SERIOUS INCIDENT REPORTING, states its own legal basis as "Article
        55(1), and recitals 114 and 115 AI Act", and commits Signatories to keeping track
        of, documenting and reporting relevant information "without undue delay ... along
        the entire model lifecycle".
      - >-
        MEASURE 9.3 SUPPLIES THE PERIODS ARTICLE 55(1), POINT (c) DOES NOT, running from
        the date the Signatory "become[s] aware of the involvement of their model": two
        days for a serious and irreversible disruption of the management or operation of
        critical infrastructure; FIVE DAYS for "a serious cybersecurity breach, including
        the (self-)exfiltration of model weights and cyberattacks"; 10 days for a death;
        15 days for serious harm to health, an infringement of Union-law fundamental-rights
        obligations, or serious harm to property or the environment.
      - >-
        THE TRIGGER THRESHOLD IS LOW. Each period runs where the Signatory establishes "or
        suspect[s] with reasonable likelihood" the causal relationship between the model
        and the event.
      - >-
        Intermediate reports at least every four weeks while an incident is unresolved; a
        final report within 60 days of resolution; documentation retained at least five
        years (Measures 9.3 and 9.4).
      - >-
        Measure 9.2 lists nine items the initial report must cover, including the chain of
        events that "(directly or indirectly)" led to the incident, the model involved, and
        a root cause analysis naming "any failures or circumventions of systemic risk
        mitigations".
      - >-
        RECITAL (a), PRINCIPLE OF APPROPRIATE LIFECYCLE MANAGEMENT: Signatories recognise
        that providers "should continuously assess and mitigate systemic risks, taking
        appropriate measures along the entire model lifecycle (INCLUDING DURING DEVELOPMENT
        THAT OCCURS BEFORE AND AFTER A MODEL HAS BEEN PLACED ON THE MARKET)".
    documented_negatives:
      - >-
        As of 12 September 2026, in the chapter as held: it contains no definition of
        'serious incident' and does not cite Article 3, point (49) anywhere. The Measure
        9.3 categories are stated in their own terms, and the second of them - a serious
        cybersecurity breach including (self-)exfiltration of model weights and
        cyberattacks - has no counterpart among the four limbs of Article 3, point (49).
    tier_note: >-
      A voluntary instrument drawn up by independent experts in a multi-stakeholder process,
      not Union legislation. Its significance here is not that it binds but that a Signatory
      has adopted it: Article 55(2) makes adherence a way of demonstrating compliance, and
      Article 56(6) as amended obliges the Commission to assess whether the codes cover the
      Article 53 and 55 obligations and to publish that assessment.

  - id: ec-cop-adequacy-opinion
    tier: T4
    date: "2025-08-01"
    retrieved: "2026-09-12"
    title: "Commission Opinion on the assessment of the General-Purpose AI Code of Practice within the meaning of Article 56 of Regulation (EU) 2024/1689"
    reference: "C(2025) 5361 final, Brussels, 1.8.2025"
    url: "https://digital-strategy.ec.europa.eu/en/library/commission-opinion-assessment-general-purpose-ai-code-practice"
    document_url: "https://ec.europa.eu/newsroom/dae/redirection/document/118688"
    sha256: "60ef852b4bd23c7e269426f4e5254896df9a46c9945d8070934fb9efc557c94c"
    establishes:
      - >-
        PARA. 57, THE CONCLUSION: "the Commission concludes that the General-Purpose AI
        Code of Practice adequately covers the obligations provided for in Articles 53 and
        55 of the AI Act and meets the aims according to Article 56 of the AI Act."
      - >-
        PARA. 38: "the Safety and Security Chapter of the Code adequately covers the
        obligations provided for in Article 55(1), and the parts thereof outlined in
        Article 56(2), points (c) and (d), of the AI Act, for providers of general-purpose
        AI models with systemic risk."
      - >-
        PARA. 33, THE MOST IMPORTANT SENTENCE IN THIS REGISTER FOR THE TIMING QUESTION:
        Commitment 9 "specifies how providers of general-purpose AI models with systemic
        risk may keep track of, document, and report relevant information about serious
        incidents ... pursuant to Article 55(1), point (c), of the AI Act. In particular,
        it sets out ... WHAT 'WITHOUT UNDUE DELAY' TYPICALLY REQUIRES OF REPORTING
        TIMELINES (MEASURE 9.3)". The Commission is stating what the statutory phrase
        typically requires, and pointing at the two/five/ten/fifteen-day scheme.
      - >-
        Para. 28: the Transparency and Copyright Chapters adequately cover Art. 53(1) and
        the parts outlined in Art. 56(2), points (a) and (b); the Safety and Security
        Chapter adequately covers the transparency obligations specific to systemic-risk
        model providers under Annex XI, Section 2.
      - >-
        Para. 35: the Art. 55(1) obligations "are not isolated but complement and feed into
        each other" - model evaluations under (a) and serious incident reporting under (c)
        are "an essential part of" systemic risk assessment under (b), and cybersecurity
        under (d) limits the scenarios that could lead to incidents.
    tier_note: >-
      A published Commission act, C(2025) 5361 final, not a web page and not guidance that
      disclaims itself. It is the firmest support in this register for the proposition that
      the Code's timelines are how Art. 55(1)(c) is complied with.

  - id: ec-ai-board-adequacy
    tier: T4
    date: "2025-08-02"
    retrieved: "2026-09-12"
    title: "Conclusion of the Artificial Intelligence Board on the Assessment of the General-Purpose AI Code of Practice pursuant to Article 56 of Regulation 2024/1689"
    url: "https://digital-strategy.ec.europa.eu/en/library/commission-opinion-assessment-general-purpose-ai-code-practice"
    document_url: "https://ec.europa.eu/newsroom/dae/redirection/document/118687"
    sha256: "8b7da6b27ff9bd88f7b689605dd7713550ec8a689de2b1ec781e0b6d43302677"
    establishes:
      - >-
        Section 1.3: "the Board concludes that the Code covers the obligations provided for
        in Article 53 and Article 55 of the AI Act", and covers the issues outlined in
        Art. 56(2), points (a), (c) and (d), leaving point (b) to the AI Office's template.
      - >-
        The Board "nonetheless recommends closely monitoring the effectiveness of these
        measures" - an endorsement with a reservation attached, which the Commission
        Opinion does not carry in the same terms.
    tier_note: >-
      Cited alongside the Commission Opinion because the two are separate acts by separate
      bodies reaching the same conclusion, and because the Board's is the qualified one.

  - id: ec-transparency-code-adequacy
    tier: T4
    date: "2026-07-09"
    retrieved: "2026-09-12"
    title: "Commission opinion on the assessment of the Code of Practice on Transparency of AI-generated Content"
    url: "https://digital-strategy.ec.europa.eu/en/library/commission-opinion-assessment-code-practice-transparency-ai-generated-content"
    establishes:
      - >-
        Cited only as a comparator, and a close one. The page states that "On July 8, the
        Commission concluded that the Code of Practice on Transparency of AI-generated
        Content ADEQUATELY COVERS THE OBLIGATIONS PROVIDED FOR IN ARTICLES 50(2), (4) and
        (5) AI Act and facilitates their effective implementation. The following day, the
        AI Board adopted its Adequacy Assessment code."
      - >-
        That is the Article 56(6) formula - assessment by reference to named provisions,
        published, with a Board adequacy assessment alongside - applied to a different code
        eight months after the GPAI opinion and days before the Omnibus entered into force.
        It shows what a provision-specific published assessment looks like in practice.
      - >-
        It also records that "Adherence to the code does not constitute conclusive evidence
        of compliance with these obligations."
    tier_note: >-
      Not about general-purpose AI models. Included because it establishes the Commission's
      own practice, which is what makes the absence of a post-Omnibus equivalent for the
      GPAI Code a fact worth stating rather than an absence of evidence.

  - id: ec-gpai-guidelines
    tier: T4
    date: "2025-11-19"
    title: "Commission guidelines on the scope of the obligations for providers of general-purpose AI models established by Regulation (EU) 2024/1689"
    reference: "C(2025) 7719 final"
    url: "https://digital-strategy.ec.europa.eu/en/library/guidelines-scope-obligations-providers-general-purpose-ai-models-under-ai-act"
    retrieved: "2026-09-12"
    document: "Guidelines_on_the_scope_of_the_obligations_for_generalpurpose_AI_models_established_by_AI_Act_English.PDF"
    sha256: "13481bd90108505c477165c8aefb13dbe7a83847bad0e983e09115f78aeefe78"
    pinpoint_note: >-
      The URL resolves to a library landing page, not to the paragraphs cited. Every
      paragraph reference below was read from the linked PDF, whose SHA-256 is recorded
      so that a reader can confirm they hold the same document. The Commission has
      revised guidance under this reference before; a hash is the only citation that
      survives that.
    establishes:
      - "Para. 9: not binding on providers; only the CJEU may authoritatively interpret; BUT sets out the interpretation 'on which it will base its enforcement action'"
      - "Para. 22: model lifecycle begins at the start of the large pre-training run; development before or after market placement is the SAME model's lifecycle; development stages are not different models"
      - "Para. 51: use for 'internal processes that are essential for providing a product or service to third parties or that affect the rights of natural persons in the Union' is an example of PLACING ON THE MARKET"
      - "Para. 52: examples require case-by-case assessment, read with the Blue Guide and Arts. 3(9)-(10) and Recital 97"
      - "Para. 54 (s.3.1.3): quotes Recital 97 deemed-placement rule for an own model integrated into the provider's own system made available or put into service"
      - "Para. 112: the Commission could take no enforcement action in the first year from 2 Aug 2025, its powers entering application 2 Aug 2026 — corroborates the Art. 113 derivation"
    documented_negatives:
      - >-
        The Guidelines reproduce the Art. 3(63) research exclusion when setting out the
        definition and nowhere condition or gloss it. The phrase 'sole purpose of research'
        does not occur in the Guidelines; that qualifier is Recital 97's alone.
    tier_note: >-
      T4 as an independent authority relative to the provider, but note it is the
      enforcing body's own statement of how it will enforce — authoritative as to
      enforcement posture, expressly not as to interpretation of the Act.

  - id: ec-gpai-qa
    tier: T4
    date: "2026-09-11"
    date_note: >-
      The page carries no publication date and is revised in place. The date recorded
