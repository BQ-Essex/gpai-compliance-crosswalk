  - id: ec-gpai-guidelines
    tier: T4
    date: "2025-11-19"
    title: "Commission guidelines on the scope of the obligations for providers of general-purpose AI models established by Regulation (EU) 2024/1689"
    reference: "C(2025) 7719 final"
    url: "https://digital-strategy.ec.europa.eu/en/library/guidelines-scope-obligations-providers-general-purpose-ai-models-under-ai-act"
    retrieved: "2026-09-12"
    currency_check: >-
      Checked 12 September 2026 against the Commission's own library page for this
      document. The page records publication 18 July 2025 and last update 20 April 2026,
      and it still serves document 118340 - the file held here. The April update added a
      block of roughly a dozen further document ids, consistent with the 24 official
      language versions the page advertises, rather than a revision of the English text.
      So the paragraph-level citations in this analysis are to the document the Commission
      currently serves.
      ONE DISCREPANCY LEFT OPEN: the library page gives publication as 18 July 2025 while
      the document itself is headed C(2025) 7719 final, Brussels, 19.11.2025. Both are
      recorded; neither is resolved here, and the paragraph citations are to the file.
    document: "Guidelines_on_the_scope_of_the_obligations_for_generalpurpose_AI_models_established_by_AI_Act_English.PDF"
    sha256: "13481bd90108505c477165c8aefb13dbe7a83847bad0e983e09115f78aeefe78"
    pinpoint_note: >-
      The URL resolves to a library landing page, not to the paragraphs cited. Every
      paragraph reference below was read from the linked PDF, whose SHA-256 is recorded
      so that a reader can confirm they hold the same document. The Commission has
      revised guidance under this reference before; a hash is the only citation that
      survives that.
    establishes:
      - "Para. 9: not binding on providers; only the CJEU may authoritatively interpret; BUT sets out the interpretation 'on which it will base its enforcement action'"
      - "Para. 22: model lifecycle begins at the start of the large pre-training run; development before or after market placement is the SAME model's lifecycle; development stages are not different models"
      - "Para. 51: use for 'internal processes that are essential for providing a product or service to third parties or that affect the rights of natural persons in the Union' is an example of PLACING ON THE MARKET"
      - "Para. 52: examples require case-by-case assessment, read with the Blue Guide and Arts. 3(9)-(10) and Recital 97"
      - "Para. 54 (s.3.1.3): quotes Recital 97 deemed-placement rule for an own model integrated into the provider's own system made available or put into service"
      - "Para. 112: the Commission could take no enforcement action in the first year from 2 Aug 2025, its powers entering application 2 Aug 2026 — corroborates the Art. 113 derivation"
      - >-
        PARA. 100, FOUND ON 12 SEPTEMBER 2026 AND NOT BEFORE. See the corrections log: this
        document was held from the first day and searched for the scope question only. It
        answers the serious-incident question too, and does so in the ENFORCEMENT section,
        section 5, rather than anywhere definitional. Verbatim: “Such proactive reporting is
        without prejudice to the obligation to keep track of, document, and report relevant
        information about 'serious incidents' under Article 55(1), point (c), AI Act. The AI
        Office considers that this obligation covers serious cybersecurity breaches related
        to the model or its physical infrastructure, including the (self-)exfiltration of
        model parameters and cyberattacks, due to their possible implications for the
        obligations provided for in Article 55(1), points (b) and (d), AI Act. Apart from
        this, the AI Office considers a 'serious incident' in the context of Chapter V AI Act
        as any incident or malfunctioning of a general-purpose AI model that directly or
        indirectly leads to any of the events listed in the corresponding definition for AI
        systems in Article 3(49), points (a) to (d), AI Act.”
      - >-
        Two consequences of para. 100 for this analysis. FIRST, the cybersecurity trigger is
        not the Code's alone: the AI Office reads the STATUTORY obligation at Art. 55(1)(c)
        as covering it, and anchors it in Art. 55(1), points (b) and (d), rather than in Art.
        3(49). So the five-day route no longer depends on reading the Commission Opinion at
        para. 33 as construing the Act. SECOND, the bridging gap is bridged, in guidance: the
        AI Office applies Art. 3(49), points (a) to (d), to models by treating a model
        incident that “directly or indirectly leads to” those events as a serious incident.
        That is a construction the enacting text does not supply, which is the same pattern
        as Recital 97 and the same reason Recommendation 1 exists.
      - >-
        Note the wording difference, which is not trivial. The Guidelines say “model
        PARAMETERS”; Measure 9.3 of the Code says “model WEIGHTS”. Both are read here as
        covering the same thing, but the Act uses neither term and nothing in this analysis
        turns on their being identical.
    documented_negatives:
      - >-
        The Guidelines reproduce the Art. 3(63) research exclusion when setting out the
        definition and nowhere condition or gloss it. The phrase 'sole purpose of research'
        does not occur in the Guidelines; that qualifier is Recital 97's alone.
    tier_note: >-
      T4 as an independent authority relative to the provider, but note it is the
      enforcing body's own statement of how it will enforce — authoritative as to
      enforcement posture, expressly not as to interpretation of the Act.

