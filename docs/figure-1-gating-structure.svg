<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1030" viewBox="0 0 780 1030" font-family="Georgia, 'Times New Roman', serif">
  <rect width="780" height="1030" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrowOut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2f2f"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b4c7e"/>
    </marker>
  </defs>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Scope first: which obligations can attach, and to which model</text>
  <text x="390" y="52" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555555">Regulation (EU) 2024/1689, consolidated to 27 July 2026</text>

  <!-- GATE 0 SCOPE -->
  <rect x="60" y="72" width="660" height="150" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
  <text x="78" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">GATE 0 — SCOPE&#160;&#160;·&#160;&#160;Art. 2(8) · Art. 3 points (3), (57), (63)</text>
  <text x="78" y="119" font-size="12" fill="#333333"><tspan font-weight="bold">Art. 3(63)</tspan> — the definition of ‘general-purpose AI model’ ends: <tspan font-style="italic">“except AI models that are</tspan></text>
  <text x="78" y="137" font-size="12" font-style="italic" fill="#333333">used for research, development or prototyping activities before they are placed on the market”.</text>
  <text x="78" y="160" font-size="12" fill="#333333"><tspan font-weight="bold">Art. 2(8)</tspan> — the Regulation does not apply to research, testing or development activity</text>
  <text x="78" y="178" font-size="12" fill="#333333">prior to placing on the market. <tspan font-weight="bold">One exception:</tspan> testing in real-world conditions.</text>
  <text x="78" y="201" font-size="12" fill="#333333"><tspan font-weight="bold">Art. 3(3)</tspan> — ‘provider’ develops a model <tspan font-style="italic">and places it on the market</tspan>. Standing, not just timing.</text>
  <text x="78" y="217" font-size="11" font-style="italic" fill="#777777">Recital 115 cannot cure an operative exclusion — Nilsson C-162/97; Manfredi C-308/97; Tyson Parketthandel C-134/08.</text>

  <!-- split -->
  <line x1="390" y1="222" x2="390" y2="248" stroke="#333333" stroke-width="1.6"/>
  <line x1="200" y1="248" x2="580" y2="248" stroke="#333333" stroke-width="1.6"/>
  <line x1="200" y1="248" x2="200" y2="286" stroke="#8a2f2f" stroke-width="1.8" marker-end="url(#arrowOut)"/>
  <line x1="580" y1="248" x2="580" y2="286" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- left: research model, out -->
  <rect x="48" y="288" width="306" height="132" rx="6" fill="#fbeeee" stroke="#8a2f2f" stroke-width="2.2"/>
  <text x="64" y="311" font-size="12.5" font-weight="bold" fill="#6b2020">THE RESEARCH MODEL</text>
  <text x="64" y="331" font-size="11.5" fill="#5c2020">“internal-only research model”, “not intended</text>
  <text x="64" y="347" font-size="11.5" fill="#5c2020">for public release” · ~95% of attacking agents</text>
  <text x="64" y="370" font-size="12" font-weight="bold" fill="#6b2020">Appears outside the definition.</text>
  <text x="64" y="388" font-size="11.5" fill="#5c2020">Arts. 51, 52, 53, 55 cannot attach;</text>
  <text x="64" y="404" font-size="11.5" fill="#5c2020">Art. 91 cannot reach its documentation.</text>
  <text x="64" y="416" font-size="10.5" font-style="italic" fill="#8a2f2f">Verdict: the disclosed record does not resolve this.</text>

  <!-- the exception that does not open -->
  <rect x="48" y="434" width="306" height="104" rx="6" fill="#ffffff" stroke="#8a2f2f" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="64" y="456" font-size="11.5" font-weight="bold" fill="#6b2020">The one route back — and it does not open</text>
  <text x="64" y="475" font-size="11" fill="#5c2020"><tspan font-weight="bold">Art. 3(57)</tspan>: <tspan font-style="italic">temporary</tspan> testing of a system <tspan font-style="italic">for its</tspan></text>
  <text x="64" y="491" font-size="11" font-style="italic" fill="#5c2020">intended purpose, outside a laboratory, under</text>
  <text x="64" y="507" font-size="11" fill="#5c2020">Art. 57 or 60 conditions.</text>
  <text x="64" y="528" font-size="11" font-weight="bold" fill="#6b2020">Drafted for exposure that is chosen. This escaped.</text>

  <!-- right: deployed model, in -->
  <rect x="404" y="288" width="328" height="132" rx="6" fill="#e9f3ec" stroke="#2d6a4f" stroke-width="2.2"/>
  <text x="420" y="311" font-size="12.5" font-weight="bold" fill="#1a3d2c">THE DEPLOYED MODEL</text>
  <text x="420" y="331" font-size="11.5" fill="#1a3d2c">On the market · ~5% of attacking agents ·</text>
  <text x="420" y="347" font-size="11.5" fill="#1a3d2c">“also reproduced an exploit” · classifiers disabled</text>
  <text x="420" y="370" font-size="12" font-weight="bold" fill="#1a3d2c">Art. 55 attaches in full.</text>
  <text x="420" y="390" font-size="11.5" fill="#1a3d2c">The cross-walk below runs against this model.</text>
  <line x1="568" y1="420" x2="568" y2="452" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- GATE 1 -->
  <rect x="404" y="454" width="328" height="104" rx="6" fill="#fdf4e5" stroke="#9a6a00" stroke-width="2"/>
  <text x="420" y="476" font-size="12.5" font-weight="bold" fill="#6b4a00">GATE 1 — Art. 3, point (49)</text>
  <text x="420" y="496" font-size="11.5" fill="#5c4000">(b) needs serious <tspan font-weight="bold">and irreversible</tspan>; rebuilding defeats it</text>
  <text x="420" y="514" font-size="11.5" fill="#5c4000">(d) harm to property — <tspan font-weight="bold">no irreversibility</tspan> — unresolved</text>
  <text x="420" y="534" font-size="11" font-style="italic" fill="#9a6a00">Bridging gap: 3(49) is defined by reference to an AI</text>
  <text x="420" y="549" font-size="11" font-style="italic" fill="#9a6a00">SYSTEM; 55(1)(c) binds providers of MODELS.</text>

  <line x1="568" y1="558" x2="568" y2="586" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- GATE 2 -->
  <rect x="404" y="588" width="328" height="76" rx="6" fill="#f6f6f6" stroke="#666666" stroke-width="1.6"/>
  <text x="420" y="610" font-size="12.5" font-weight="bold" fill="#333333">GATE 2 — Art. 55(1), point (c)</text>
  <text x="420" y="629" font-size="11.5" fill="#333333">keep track of · document · report</text>
  <text x="420" y="648" font-size="11.5" fill="#333333">“without undue delay” — <tspan font-weight="bold">no period specified</tspan></text>

  <!-- GATE 3 -->
  <line x1="568" y1="664" x2="568" y2="692" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="48" y="694" width="684" height="146" rx="6" fill="#eef2f9" stroke="#2b4c7e" stroke-width="2.4"/>
  <text x="66" y="717" font-size="13.5" font-weight="bold" fill="#1c3557">GATE 3 — obligations that do not depend on the Art. 3(49) classification</text>
  <text x="66" y="740" font-size="12" fill="#1c3557"><tspan font-weight="bold">55(1)(a)</tspan> evaluation per standardised protocols, incl. <tspan font-style="italic">documented</tspan> adversarial testing</text>
  <text x="66" y="762" font-size="12" fill="#1c3557"><tspan font-weight="bold">55(1)(d)</tspan> cybersecurity — Recital 115 enumerates “circumvention of safety measures”</text>
  <text x="66" y="784" font-size="12" fill="#1c3557"><tspan font-weight="bold">55(2)</tspan> Code of Practice branch or “alternative adequate means” — either way, artifacts exist</text>
  <text x="66" y="810" font-size="12.5" font-weight="bold" fill="#1c3557">55(1)(b) — systemic risk “that may stem from THE DEVELOPMENT, the placing on</text>
  <text x="66" y="828" font-size="12.5" font-weight="bold" fill="#1c3557">the market, or the use”. In the enacting text, not a recital.</text>

  <!-- the bridge back -->
  <path d="M 48 790 L 24 790 L 24 392 L 42 392" fill="none" stroke="#2b4c7e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowBack)"/>
  <text x="17" y="660" font-size="10.5" font-weight="bold" fill="#2b4c7e" transform="rotate(-90 17 660)">reaches the excluded activity as a RISK SOURCE</text>

  <line x1="390" y1="840" x2="390" y2="868" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- GATE 4 -->
  <rect x="140" y="870" width="500" height="96" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
  <text x="158" y="893" font-size="13.5" font-weight="bold" fill="#1a1a1a">GATE 4 — the instrument&#160;&#160;·&#160;&#160;Art. 91, issued by the Commission</text>
  <text x="158" y="914" font-size="11.5" fill="#333333">Art. 3(47): the AI Office is “the Commission’s function”, not a legal person.</text>
  <text x="158" y="933" font-size="11.5" fill="#333333">91(4) form: legal basis · purpose · information · period · Art. 101 fines</text>
  <text x="158" y="954" font-size="11" font-style="italic" fill="#555555">Section I asks the scope question first, and invites the addressee’s own position on Art. 3(63).</text>

  <text x="390" y="996" text-anchor="middle" font-size="11" font-style="italic" fill="#777777">The research model exits at Gate 0. The deployed model carries the cross-walk. Art. 55(1)(b) is the one duty that reaches back.</text>
  <text x="390" y="1014" text-anchor="middle" font-size="10.5" fill="#999999">An earlier version of this figure led on Art. 52(1) notification, before Arts. 2(8), 3(3) and 3(63) were consulted. See docs/correction-scope.md.</text>
</svg>
