<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="960" height="800" fill="#ffffff"/>

  <!-- the episode -->
  <rect x="105" y="8" width="750" height="40" rx="3" fill="#e8e8e6" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">July 2026: a research model reaches a third party’s production infrastructure</text>

  <line x1="480" y1="48" x2="480" y2="66" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="240" y1="66" x2="720" y2="66" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="240" y1="66" x2="240" y2="88" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="720" y1="66" x2="720" y2="88" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- enacting text -->
  <rect x="20" y="90" width="440" height="124" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="38" y="112" font-size="13" font-weight="bold" letter-spacing="1.1" fill="#767676">THE ENACTING TEXT</text>
  <text x="38" y="138" font-size="16" fill="#1a1a1a">Art. 3(63) excludes models “used for</text>
  <text x="38" y="160" font-size="16" fill="#1a1a1a">research, development or prototyping</text>
  <text x="38" y="182" font-size="16" fill="#1a1a1a">activities before they are placed on the</text>
  <text x="38" y="204" font-size="16" fill="#1a1a1a">market”. Art. 2(8) excludes pre-market R&amp;D.</text>

  <line x1="240" y1="214" x2="240" y2="240" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="242" width="400" height="36" rx="3" fill="#1a1a1a"/>
  <text x="240" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Outside Chapter V. The analysis ends here.</text>

  <!-- commission's reading -->
  <rect x="500" y="90" width="440" height="124" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="518" y="112" font-size="13" font-weight="bold" letter-spacing="1.1" fill="#767676">THE COMMISSION’S READING</text>
  <text x="518" y="138" font-size="16" fill="#1a1a1a">Recital 97, at Guidelines ¶54 and in the</text>
  <text x="518" y="160" font-size="16" fill="#1a1a1a">Q&amp;A: a model integrated into its provider’s</text>
  <text x="518" y="182" font-size="16" fill="#1a1a1a">own AI system put into service is deemed</text>
  <text x="518" y="204" font-size="16" fill="#1a1a1a">placed on the market.</text>

  <line x1="720" y1="214" x2="720" y2="238" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="720" y1="238" x2="480" y2="238" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="480" y1="238" x2="480" y2="296" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="492" y="266" font-size="15" font-style="italic" fill="#444">but the route needs three facts, in this order</text>

  <!-- gate 1 -->
  <rect x="160" y="298" width="640" height="78" rx="3" fill="#f1f1ef" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="178" y="322" font-size="17" font-weight="bold" fill="#1a1a1a">1 · A placement event?</text>
  <text x="782" y="322" text-anchor="end" font-size="17" font-weight="bold" fill="#1a1a1a">Record: denied</text>
  <text x="178" y="345" font-size="15" fill="#333">Integration into an own system put into service, an intention to place, or a</text>
  <text x="178" y="366" font-size="15" fill="#333">shared pre-training run with a placed model  ·  asked by Requests 4a and 2b</text>

  <line x1="480" y1="376" x2="480" y2="394" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- gate 2 -->
  <rect x="160" y="396" width="640" height="78" rx="3" fill="#f1f1ef" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="178" y="420" font-size="17" font-weight="bold" fill="#1a1a1a">2 · In the Union?</text>
  <text x="782" y="420" text-anchor="end" font-size="17" font-weight="bold" fill="#1a1a1a">Record: silent</text>
  <text x="178" y="443" font-size="15" fill="#333">Art. 2(1)(a) reaches placing on the market “in the Union”; Art. 3(11), supply</text>
  <text x="178" y="464" font-size="15" fill="#333">“for own use in the Union”  ·  no account addresses it  ·  asked by Request 4a</text>

  <line x1="480" y1="474" x2="480" y2="492" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- gate 3 -->
  <rect x="160" y="494" width="640" height="78" rx="3" fill="#f1f1ef" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="178" y="518" font-size="17" font-weight="bold" fill="#1a1a1a">3 · Systemic risk?</text>
  <text x="782" y="518" text-anchor="end" font-size="17" font-weight="bold" fill="#1a1a1a">Record: not public</text>
  <text x="178" y="541" font-size="15" fill="#333">Art. 51(2) presumes it above 10²⁵ FLOP of cumulative training compute</text>
  <text x="178" y="562" font-size="15" fill="#333">·  known only to the provider  ·  asked by Request 2</text>

  <line x1="480" y1="572" x2="480" y2="592" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="240" y1="592" x2="720" y2="592" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="240" y1="592" x2="240" y2="614" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="720" y1="592" x2="720" y2="614" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- outcomes -->
  <rect x="20" y="616" width="440" height="106" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="38" y="640" font-size="16" font-weight="bold" fill="#1a1a1a">All three hold</text>
  <text x="38" y="664" font-size="15" fill="#333">Chapter V applies from the placement date, and a</text>
  <text x="38" y="686" font-size="15" fill="#333">two-week notification duty under Art. 52(1) was</text>
  <text x="38" y="708" font-size="15" fill="#333">engaged during development.</text>

  <rect x="500" y="616" width="440" height="106" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="518" y="640" font-size="16" font-weight="bold" fill="#1a1a1a">Any one fails</text>
  <text x="518" y="664" font-size="15" fill="#333">Outside Chapter V on the Commission’s own</text>
  <text x="518" y="686" font-size="15" fill="#333">reading; the response is legislative — the three</text>
  <text x="518" y="708" font-size="15" fill="#333">amendments to Arts 3(9), 3(63) and 55(1)(c).</text>

  <line x1="240" y1="722" x2="240" y2="740" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="720" y1="722" x2="720" y2="740" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="240" y1="740" x2="720" y2="740" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="480" y1="740" x2="480" y2="754" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="130" y="756" width="700" height="36" rx="3" fill="#1a1a1a"/>
  <text x="480" y="780" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Either way, the answer comes from an Article 91 request.</text>
</svg>
