<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1060" viewBox="0 0 800 1060" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="1060" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a2f2f"/></marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Do the obligations attach, and by what route</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">Regulation (EU) 2024/1689 consolidated to 27.07.2026 · Commission Guidelines C(2025) 7719 final</text>

  <!-- Q1 -->
  <rect x="150" y="72" width="500" height="76" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="168" y="95" font-size="13.5" font-weight="bold" fill="#1a1a1a">THE THRESHOLD QUESTION</text>
  <text x="168" y="116" font-size="12" fill="#333">The model that drove the compromise was an internal research model,</text>
  <text x="168" y="134" font-size="12" fill="#333">never released. Do Chapter V obligations reach it at all?</text>

  <line x1="400" y1="148" x2="400" y2="176" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- textual reading -->
  <rect x="40" y="178" width="340" height="150" rx="6" fill="#fbeeee" stroke="#8a2f2f" stroke-width="1.8"/>
  <text x="56" y="200" font-size="12.5" font-weight="bold" fill="#6b2020">THE TEXTUAL READING — says no</text>
  <text x="56" y="221" font-size="11.5" fill="#5c2020"><tspan font-weight="bold">Art. 2(1)(a)</tspan>: systems caught on placing OR putting</text>
  <text x="56" y="237" font-size="11.5" fill="#5c2020">into service; <tspan font-style="italic">models only on placing on the market</tspan></text>
  <text x="56" y="257" font-size="11.5" fill="#5c2020"><tspan font-weight="bold">Art. 3(63)</tspan>: definition excludes research models —</text>
  <text x="56" y="273" font-size="11.5" fill="#5c2020">no “sole purpose” qualifier, no conditions</text>
  <text x="56" y="293" font-size="11.5" fill="#5c2020"><tspan font-weight="bold">Art. 2(8)</tspan>: pre-market R&amp;D outside the Regulation;</text>
  <text x="56" y="309" font-size="11.5" fill="#5c2020">its one exception (Art. 3(57)) is for <tspan font-style="italic">elected</tspan> exposure</text>
  <text x="56" y="324" font-size="10.5" font-style="italic" fill="#8a2f2f">Available to a provider. Not the Commission’s reading.</text>

  <!-- commission reading -->
  <rect x="420" y="178" width="340" height="150" rx="6" fill="#e9f3ec" stroke="#2d6a4f" stroke-width="2.2"/>
  <text x="436" y="200" font-size="12.5" font-weight="bold" fill="#1a3d2c">THE COMMISSION’S READING — says yes</text>
  <text x="436" y="221" font-size="11.5" fill="#1a3d2c"><tspan font-weight="bold">Recital 97 · Guidelines ¶54</tspan>: own model in own</text>
  <text x="436" y="237" font-size="11.5" fill="#1a3d2c">system put into service = <tspan font-weight="bold">deemed placed on market</tspan></text>
  <text x="436" y="257" font-size="11.5" fill="#1a3d2c"><tspan font-weight="bold">Guidelines ¶51</tspan>: internal processes essential to</text>
  <text x="436" y="273" font-size="11.5" fill="#1a3d2c">third-party service = placing on the market</text>
  <text x="436" y="293" font-size="11.5" fill="#1a3d2c"><tspan font-weight="bold">Guidelines ¶22</tspan>: development is the <tspan font-style="italic">same model’s</tspan></text>
  <text x="436" y="309" font-size="11.5" fill="#1a3d2c">lifecycle — stages are not different models</text>
  <text x="436" y="324" font-size="10.5" font-style="italic" fill="#2d6a4f">Q&amp;A: internal-use exception barred to systemic-risk models</text>

  <line x1="210" y1="328" x2="210" y2="360" stroke="#8a2f2f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <line x1="590" y1="328" x2="590" y2="360" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ag)"/>

  <!-- resolution -->
  <rect x="40" y="362" width="720" height="92" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="58" y="385" font-size="13.5" font-weight="bold" fill="#1a1a1a">RESOLUTION — the route is the finding</text>
  <text x="58" y="406" font-size="12" fill="#333">The obligations attach. The weight-bearing step sits in a <tspan font-weight="bold">recital and in guidance</tspan>, not the definition.</text>
  <text x="58" y="425" font-size="12" fill="#333"><tspan font-weight="bold">Guidelines ¶9</tspan>: “not binding … Nevertheless … the interpretation <tspan font-style="italic">on which it will base its enforcement action</tspan>.”</text>
  <text x="58" y="445" font-size="11.5" font-style="italic" fill="#555">Determines what the Commission does; remains open to challenge before the CJEU.</text>

  <line x1="400" y1="454" x2="400" y2="484" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- the factual question -->
  <rect x="120" y="486" width="560" height="86" rx="6" fill="#fdf4e5" stroke="#9a6a00" stroke-width="2.4"/>
  <text x="138" y="509" font-size="13.5" font-weight="bold" fill="#6b4a00">WHAT IS LEFT IS FACTUAL, AND NOBODY OUTSIDE THE PROVIDER KNOWS IT</text>
  <text x="138" y="531" font-size="12" fill="#5c4000">Does the model exceed <tspan font-weight="bold">10²⁵ FLOP</tspan> (Art. 51(2))? If so, <tspan font-weight="bold">Art. 52(1)</tspan>’s two-week</text>
  <text x="138" y="549" font-size="12" fill="#5c4000">notification duty ran <tspan font-style="italic">during development</tspan>, and Arts. 53 and 55 applied throughout.</text>
  <text x="138" y="566" font-size="11" font-style="italic" fill="#9a6a00">The only determinate period in the chapter. → Requests 1–5 of the instrument.</text>

  <line x1="400" y1="572" x2="400" y2="600" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- obligations -->
  <rect x="40" y="602" width="720" height="150" rx="6" fill="#eef2f9" stroke="#2b4c7e" stroke-width="2.2"/>
  <text x="58" y="625" font-size="13.5" font-weight="bold" fill="#1c3557">THE OBLIGATIONS, ONCE ATTACHED</text>
  <text x="58" y="648" font-size="12" fill="#1c3557"><tspan font-weight="bold">55(1)(a)</tspan> evaluation per standardised protocols, incl. <tspan font-style="italic">documented</tspan> adversarial testing</text>
  <text x="58" y="670" font-size="12" fill="#1c3557"><tspan font-weight="bold">55(1)(d)</tspan> cybersecurity — Recital 115 enumerates “circumvention of safety measures”</text>
  <text x="58" y="692" font-size="12" fill="#1c3557"><tspan font-weight="bold">55(2)</tspan> Code of Practice branch or “alternative adequate means” — either way, artifacts exist</text>
  <text x="58" y="716" font-size="12.5" font-weight="bold" fill="#1c3557">55(1)(b) systemic risk “that may stem from THE DEVELOPMENT” — enacting text, not a</text>
  <text x="58" y="734" font-size="12.5" font-weight="bold" fill="#1c3557">recital. This one holds on either reading above.</text>

  <line x1="400" y1="752" x2="400" y2="780" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3(49) -->
  <rect x="120" y="782" width="560" height="92" rx="6" fill="#f6f6f6" stroke="#666" stroke-width="1.6"/>
  <text x="138" y="805" font-size="13" font-weight="bold" fill="#333">SEPARATE GATE for the reporting limb — Art. 3, point (49)</text>
  <text x="138" y="826" font-size="11.5" fill="#333">(b) needs serious <tspan font-weight="bold">and irreversible</tspan>; rebuilding defeats it. (d) harm to property —</text>
  <text x="138" y="844" font-size="11.5" fill="#333">no irreversibility requirement — <tspan font-weight="bold">does not resolve</tspan>. Art. 55(1)(c) has no period at all.</text>
  <text x="138" y="864" font-size="11" font-style="italic" fill="#666">Bridging gap: 3(49) is defined by reference to an AI SYSTEM; 55(1)(c) binds providers of MODELS.</text>

  <line x1="400" y1="874" x2="400" y2="902" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- instrument -->
  <rect x="150" y="904" width="500" height="96" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2.2"/>
  <text x="168" y="927" font-size="13.5" font-weight="bold" fill="#1a1a1a">THE INSTRUMENT · Art. 91, issued by the Commission</text>
  <text x="168" y="948" font-size="11.5" fill="#333">Art. 3(47): the AI Office is “the Commission’s function”, not a legal person.</text>
  <text x="168" y="967" font-size="11.5" fill="#333">91(4) form: legal basis · purpose · information · period · Art. 101 fines</text>
  <text x="168" y="988" font-size="11" font-style="italic" fill="#555">Section I asks scope first, and invites the addressee’s own position rather than pre-empting it.</text>

  <text x="400" y="1030" text-anchor="middle" font-size="11" font-style="italic" fill="#777">Two earlier versions of this figure led on Art. 52(1) notification, then on exclusion by definition. Both were wrong; see docs/correction-scope.md.</text>
</svg>
