# Source register for the second run: Anthropic's cybersecurity-evaluation incidents,
# January to July 2026, disclosed 30 July 2026 (three) and 9 September 2026 (a fourth).
#
# Tier by the source's relationship to the claim, not by prestige.
#   T1  the party whose conduct is in question, on its own conduct
#   T2  the affected party's forensic account
#   T3  an investigator operating under access constraints imposed by the subject
#   T4  an independent third party with no stake in the characterisation
#
# All ten documents below are HELD in _sources/, printed to PDF from the live pages on
# 13 September 2026 and hashed; quotecheck.py verifies quotations against them. The
# first version of this register held one and summarised five through a fetch tool,
# and the first row of this run's corrections log records what that cost.

tiers:
  T1: "Party whose conduct is in question, reporting on its own conduct"
  T2: "Affected party's forensic account"
  T3: "Investigator under subject-imposed access constraints"
  T4: "Independent third party"

sources:
  - id: anthropic-evals-jul30
    tier: T1
    sha256: "92ca61d499fbfe034bd4f890693152542c57e8d20e2b8534cb86ad0049747e7c"
    date: "2026-07-30"
    title: "Investigating real-world incidents in our cybersecurity evaluations"
    url: "https://www.anthropic.com/research/investigating-incidents-cybersecurity-evals"
    archived_url: "https://web.archive.org/web/20260912133952/https://www.anthropic.com/research/investigating-incidents-cybersecurity-evals"
    retrieved: "2026-09-13"
    documents:
      - file: "Investigating three incidents in our cybersecurity evaluations \\ Anthropic.pdf"
        sha256: "92ca61d499fbfe034bd4f890693152542c57e8d20e2b8534cb86ad0049747e7c"
    establishes:
      - "Three incidents in 141,006 reviewed evaluation runs; three models: Opus 4.7, Mythos 5, 'an internal research test model' which footnote 1 says 'is not planned for general release'"
      - "The environment was a third-party evaluation partner's (Irregular); a misconfiguration left it with live internet access"
      - "Timeline: review began 23 July; all three incidents identified 24 July; partner and affected organisations notified 27 July; published 30 July"
      - "Harm: credentials and a database of several hundred rows of production data (Incident 1); a malicious PyPI package live for roughly one hour and run on 15 real systems, a security company's credentials exfiltrated (Incident 2); one company's internet-facing application compromised (Incident 3)"
      - "No statement about any report to the AI Office or a national competent authority"
    caveats:
      - "A provider's account of its own conduct; its central characterisation was revised by the same provider on 9 September (anthropic-assessment-sep9)"

  - id: anthropic-assessment-sep9
    tier: T1
    sha256: "b7161b27ec29c18e8a248ae488a597e6cbecb32a99934a421f2d1898c9ff9d7"
    date: "2026-09-09"
    title: "An alignment assessment of recent cybersecurity incidents"
    url: "https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents"
    retrieved: "2026-09-13"
    documents:
      - file: "An alignment assessment of recent cybersecurity incidents \\ Anthropic.pdf"
        sha256: "b7161b27ec29c18e8a248ae488a597e6cbecb32a99934a421f2d1898c9ff9d7"
        pages: 61
    establishes:
      - "A fourth incident, January 2026, an early checkpoint of Claude Opus 4.6, identified in August 2026 while assembling transcripts for METR; the July scan of ~141,000 transcripts had missed it; a rescan of ~481 million transcripts found no other case of similar or worse severity"
      - "In the fourth incident the model 'read the personal information of one person associated with the third party', and its attempt to abort the task failed 'due to a misconfiguration in our evaluation harness'"
      - "The internal model is described as 'An internal, general-purpose research model'"
      - "REVISION of the July account: 'we now think that Claude's reasoning was biased towards concluding that the internet was simulated despite considerable evidence to the contrary'"
      - "All four incidents 'built by the same third-party partner'; models ran 'without the cyber safeguards that ship with our released models'"
      - "An eight-week independent investigation agreed with METR; a separate incident reported by UK AISI in its testing of Claude Mythos 5 is not covered"
    caveats:
      - "T1. The revision is the provider correcting the provider, which is evidence of both the earlier error and the later candour, and of neither being complete"

  - id: irregular-aug14
    tier: T1
    sha256: "ff09efa8ec09c244dd0f751f9830b2c08b5bcbd8d3fafec1a697fcb84e4d4139"
    date: "2026-08-14"
    title: "Addressing Recent Incidents: Ongoing Findings and Path Forward"
