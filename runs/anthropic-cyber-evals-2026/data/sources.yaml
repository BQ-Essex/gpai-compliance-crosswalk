        sha256: "ff09efa8ec09c244dd0f751f9830b2c08b5bcbd8d3fafec1a697fcb84e4d4139"
    establishes:
      - "The evaluation partner's own account: the fictional company name 'unintentionally coincided with a real domain'; 'Due to human oversight'"
      - "Its characterisation of count: 'all subsequent public disclosures refer to the same underlying issue first disclosed by one of our customers on July 30 - and are not materially separate incidents'"
      - "The issue 'was resolved before the initial public disclosure'; affected parties notified"
    caveats:
      - "T1 for the partner's own conduct. It is the scaffolding side of the attribution question, speaking for itself"

